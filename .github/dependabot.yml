version: 2

# Dependabot is discovery-only. A candidate cannot merge until a maintainer
# links it to an issue, completes the repository's structured reuse review,
# and observes the affected boundary on the exact PR head.
updates:
  - package-ecosystem: uv
    directory: /
    exclude-paths:
      - evals/**
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    commit-message:
      prefix: build(actions)
