name: agency-601-reconcile-concurrent-plan
on:
  push:
    branches: [codex/issue-601-assistant-execution-contract]
permissions:
  contents: write
concurrency:
  group: agency-601-branch-edit
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'Jongtae/agentos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-601-assistant-execution-contract
          fetch-depth: 0
      - name: Preserve concurrent owner decision from main and merge only planning conflicts
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/agency_601_reconcile_once.py || exit 0
          test "$(git branch --show-current)" = 'codex/issue-601-assistant-execution-contract'
          test "$(git rev-parse origin/main)" = 'a7f66961c473644d65b0700b808b00d7fece8fe1'
          git config core.hooksPath .githooks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main || true
          python3 scripts/agency_601_reconcile_once.py
          python3 scripts/verify_assistant_execution.py --check-spec
          python3 scripts/verify_master_plan_docs.py
          python3 scripts/verify_src_layout.py
          python3 -m unittest discover -s tests -p test_assistant_execution_gate.py -q
          git add delivery-plan.yaml TASKS.md docs/roadmap.md scripts/agency_601_reconcile_once.py
          git diff --check --cached
          git commit -m 'docs(agency): preserve concurrent #599 owner decisions in execution plan #601'
          git push origin HEAD:refs/heads/codex/issue-601-assistant-execution-contract
