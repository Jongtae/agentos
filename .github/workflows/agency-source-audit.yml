name: agency-source-audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  tracked-source:
    if: github.head_ref == 'codex/issue-601-assistant-execution-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export only version-controlled source for the bounded audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agency-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/agency-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/agency-source/source-sha.txt"
          sha256sum "$RUNNER_TEMP/agency-source/source.tar" > "$RUNNER_TEMP/agency-source/archive-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: agency-tracked-source
          path: ${{ runner.temp }}/agency-source/
          retention-days: 1
          if-no-files-found: error
