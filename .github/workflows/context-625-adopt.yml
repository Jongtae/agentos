name: context-625-one-use-document-edit
on:
  push:
    branches: [codex/625-current-context-handoff]
permissions:
  contents: write
concurrency:
  group: context-625-one-use-document-edit
  cancel-in-progress: false
jobs:
  adopt:
    if: github.repository == 'Jongtae/agentos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only preimage-checked documentation and root-plan edits
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/context_625_adopt_once.py || exit 0
          test "$(git rev-parse origin/codex/625-current-context-handoff)" = "$GITHUB_SHA"
          git checkout -B codex/625-current-context-handoff "$GITHUB_SHA"
          git config core.hooksPath .githooks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/context_625_adopt_once.py
          python3 scripts/verify_master_plan_docs.py
          python3 scripts/verify_src_layout.py
          python3 scripts/verify_assistant_execution.py --check-spec
          git diff --check
          git add AGENTS.md PRD.md TASKS.md delivery-plan.yaml docs/personal-agentos-architecture.en.md docs/presence-experience-contract.en.md docs/assistant-execution-contract.en.md docs/assistant-execution-delivery.en.md docs/roadmap.md scripts/context_625_adopt_once.py .github/workflows/context-625-adopt.yml
          git commit -m 'docs(context): bind canonical guidance and finite implementation order #625'
          git push origin HEAD:refs/heads/codex/625-current-context-handoff
