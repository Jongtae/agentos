name: delivery-refresh-1021-once
on:
  push:
    branches: [governance/1021-delivery-plan-refresh]
    paths: [.github/workflows/delivery-refresh-1021-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Jongtae/agentos' && github.ref == 'refs/heads/governance/1021-delivery-plan-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build bounded governance blobs without changing any Git reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, copy, hashlib, json, os, urllib.request
          REPO = 'https://api.github.com/repos/Jongtae/agentos'
          def request(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(REPO + path, data=payload, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          def blob(sha):
              value = request('/git/blobs/' + sha)
              raw = base64.b64decode(value['content'])
              observed = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert observed == sha
              return raw.decode('utf-8')
          original = json.loads(blob('c5b0b3aa03896796083aa4c9973d3e591aafac5f'))
          draft = json.loads(blob('1a4001efcb15e644e6031573be32f7a335d932d1'))
          result = copy.deepcopy(original)
          proposed = {i['id']: i for i in draft['iterations']}
          allowed = {
              'SECRETARY-01': {'summary'},
              'SEC-EVAL-01': {'summary', 'depends_on'},
              'SEC-A2A-01': {'summary', 'depends_on'},
              'OWNER-MODEL-01': {'milestone', 'activation_status', 'program', 'depends_on', 'delivery_contract', 'selected_phase', 'selected_by', 'reuse_pull_requests', 'tests', 'owns', 'independent_review_required', 'summary'},
          }
          for item in result['iterations']:
              for key in allowed.get(item['id'], ()):
                  item[key] = copy.deepcopy(proposed[item['id']][key])
          for name in ('GOV-DELIVERY-06', 'OSS-MEMORY-01'):
              assert name not in {i['id'] for i in original['iterations']}
              result['iterations'].append(copy.deepcopy(proposed[name]))
          result['history']['documented_completed_iterations'].append('GOV-DELIVERY-06')
          program = result['programs']['SECRETARY-01']
          for key in ('ordered_substeps', 'active_substeps', 'owner_amendments', 'owner_directed_followups_rule', 'current_delivery'):
              program[key] = copy.deepcopy(draft['programs']['SECRETARY-01'][key])
          result['next_goal'] = copy.deepcopy(draft['next_goal'])
          assert result['next_goal']['status'] == 'owner-activated-goal-ready'
          assert program['active_substeps'] == ['OWNER-MODEL-01']
          assert result['programs']['PRESENCE-01'] == original['programs']['PRESENCE-01']
          assert program['owner_directed_followups'] == original['programs']['SECRETARY-01']['owner_directed_followups']
          plan = json.dumps(result, ensure_ascii=True, separators=(',', ':')) + '\n'
          agents_original = blob('2a7ee9de404978c91efeabad7cb25ed54b019f70')
          start_marker = '## Secretary agency re-plan — #653 (2026-09-26)\n\n'
          end_marker = '\n\n**Pilot posture.**'
          a = agents_original.index(start_marker) + len(start_marker)
          b = agents_original.index(end_marker, a)
          replacement = '''SECRETARY-01 [#662](https://github.com/Jongtae/agentos/issues/662) remains the sole owner-selected parent under the [Secretary Agency Contract](docs/secretary-agency-contract.en.md). Its earlier #653 activation, #690 UI-renewal pause and #770 resumption are preserved as history. **Owner delivery refresh 2026-10-06 ([#1021](https://github.com/Jongtae/agentos/issues/1021)) supersedes the older next-step order:** OWNER-MODEL-01 [#794](https://github.com/Jongtae/agentos/issues/794) **phase 3 only** → SEC-EVAL-01 [#660](https://github.com/Jongtae/agentos/issues/660) owner-operated closeout → GOV-OSS-01 [#875](https://github.com/Jongtae/agentos/issues/875) Track A implementation → SEC-A2A-01 [#661](https://github.com/Jongtae/agentos/issues/661). Root `delivery-plan.yaml` names the current child and remains authoritative for selection and dependencies.

Read the bounded [#794 phase-3 delivery contract](docs/owner-model-phase3-delivery.en.md). Reuse merged #886 (journal), #896 (sources) and #972 (#918 memory save/undo); do not repeat them. The selected work is exact per-item correction, forget with 7-day undo then purge, explicit immediate purge and truthful durable receipts. #794 is an enumerated, parent-controlled substep, not a self-activating follow-up. The checked-in goal-ready state deliberately leaves the delivery heartbeat paused; refreshing priority does not start Codex, a scheduler, a paid/live probe or an owner installation. #660 still requires real operating evidence on its closeout head. `OSS-MEMORY-01` is a reserved dependency gate, not permission to implement: it needs its own bounded issue and goal-ready record after #794/#660, reusing the completed #894 spike. Do not skip it to advance #661 or reopen closed backlog from historical prose.

The #880 Pages decision is unchanged: management happens in conversation, and pages exist only for results that text cannot carry and inputs that conversation cannot safely carry (Presence Experience Contract, *Pages*). Merged owner-directed follow-ups are regression inputs. PRESENCE-01 #508 remains paused; its merged work is regression input.'''
          agents = agents_original[:a] + replacement + agents_original[b:]
          assert agents[:a] == agents_original[:a]
          assert agents[agents.index(end_marker, a):] == agents_original[b:]
          for name, content in [('delivery-plan.yaml', plan), ('AGENTS.md', agents)]:
              created = request('/git/blobs', {'content': content, 'encoding': 'utf-8'})
              print(json.dumps({'file': name, 'blob_sha': created['sha'], 'bytes': len(content.encode())}))
          print('PRESERVATION_OK: original-only construction; four scoped iteration edits; two append-only records; no Git ref, runtime, CI gate or heartbeat changed.')
          PY
