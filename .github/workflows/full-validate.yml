name: full-validate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  full-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv sync --locked --extra mcp-host --extra schema-validation --group dev --no-python-downloads
      - run: .venv/bin/python scripts/verify_master_plan_docs.py
      - run: .venv/bin/python scripts/verify_readme_localization.py --check-git-diff
      - run: .venv/bin/python scripts/verify_src_layout.py
      - run: .venv/bin/python -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('docs/issue-branch-ledger.jsonl').read_text(encoding='utf-8').splitlines()]"
      - run: .venv/bin/python scripts/verify_agentpackage_v01.py
      - run: PATH="$PWD/.venv/bin:$PATH" python3 -m pytest -q tests
