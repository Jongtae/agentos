name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: scope
        name: Decide whether this PR needs the full suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Pushes to main are a cheap merged-tree integrity pass. The heavy
          # suite has already been required on runtime-affecting PR heads and
          # is also covered by the scheduled/manual full-validate workflow.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "full_suite=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          full_suite=false
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              *.md|docs/assets/*|LICENSE|NOTICE|TRADEMARKS.md)
                ;;
              *)
                full_suite=true
                echo "Full suite required by: $path"
                break
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "full_suite=$full_suite" >> "$GITHUB_OUTPUT"

      - name: Verify canonical documents and plan integrity
        run: python3 scripts/verify_master_plan_docs.py

      - name: Verify PR reuse review
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/verify_reuse_review.py

      - name: Verify public README parity
        run: python3 scripts/verify_readme_localization.py --check-git-diff

      - name: Verify src layout
        run: python3 scripts/verify_src_layout.py

      - name: Verify delivery-plan package copy
        run: cmp -s delivery-plan.yaml src/personal_agent/delivery-plan.yaml

      - name: Verify ledger JSON
        run: python3 -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('docs/issue-branch-ledger.jsonl').read_text(encoding='utf-8').splitlines()]"

      - name: Install full-suite dependencies
        if: steps.scope.outputs.full_suite == 'true'
        run: |
          python -m pip install --upgrade pip pytest pypdf python-docx openpyxl
          python -m pip install -e '.[schema-validation]'

      - name: Verify AgentPackage v0.1
        if: steps.scope.outputs.full_suite == 'true'
        run: python3 scripts/verify_agentpackage_v01.py

      - name: Run full test suite
        if: steps.scope.outputs.full_suite == 'true'
        run: python3 -m pytest -q tests
