n","activation_status":"owner-directed-followup","milestone":"Compact application settings","depends_on":["UX-PREF-04"],"contract":"design/settings-ux-renewal-spec.en.md","tests":["python3 -m pytest -q tests/test_settings_ui.py tests/test_ui_quality.py"],"summary":"Owner requested an at-a-glance provider/model/effort/account relationship summary after #806. Bounded presentation-only follow-up; preserve actual state evidence, backend contracts and SECRETARY-01 scheduler selection.","authority":"Explicit owner feedback in the interactive chat authorizes this summary refinement and the existing autonomous PR remediation/merge workflow. No runtime or new stored setting."},{"id":"OWNER-MODEL-02","milestone":"Secretary follow-through (owner-directed)","issue":804,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_orchestrator.py tests/test_current_context.py tests/test_context_consumption.py tests/test_bounded_execution.py tests/test_owner_profile.py"],"summary":"Owner feedback 2026-09-28 (Works 500d717c and a289089a: a new lunch request narrowed to the previous topic with no profile, clock or situation, and a stated workplace never saved): the profile and current-context snapshot are always given to the worker and the plan call; with current context off the snapshot is the clock only; save_memory asks the AI to save durable facts the owner states (#597 still decides Memory or candidate) and stays offered on native-search turns; the plan question resolves recent_conversation only for a request that continues it. Orchestration and blocker removal only; no new tool, grant or task logic."},{"id":"DOCS-ACK-01","milestone":"Secretary follow-through (owner-directed)","issue":815,"kind":"documentation","activation_status":"owner-activated-goal-ready","contract":"AGENTS.md","tests":["python3 -m pytest -q tests/test_readme_localization.py"],"summary":"Owner direction 2026-09-28: acknowledge Anshad Ameenza's 'The Agent OS' and b3os as inspirations, plus other references actually used (process patterns, research, standards). Docs only: docs/acknowledgements.en.md, README More link in all four locales, the 2026-09-28 owner-model research report under docs/research."},{"id":"OWNER-MODEL-03","milestone":"Secretary follow-through (owner-directed)","issue":805,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_owner_model_upkeep.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-28 ('always keep the owner in mind: gather and recognise owner information asynchronously, but avoid excessive collection'). Phase 1 only: after a finished Work, an off-thread, budgeted, pausable upkeep asks the Judgment AI for owner-model proposals in five categories; stated facts become Memory only through a per-fact #597 judgment and the value/key checks, inferences stay candidates; evidence is content-free. No new sources."},{"id":"ORCH-07","milestone":"Secretary follow-through (owner-directed)","issue":813,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"decision-layer.en.md","tests":["python3 -m pytest -q tests/test_orchestrator.py"],"summary":"Owner-reported live failure 2026-09-28 (Work 33d1d85f): the worker catalogue lists only tools a turn is offered, so a plan never briefs a context-gated tool while current context is off. Orchestration only."},{"id":"OWNER-SETTINGS-01","milestone":"Secretary follow-through (owner-directed)","issue":814,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_owner_settings_conversation.py tests/test_settings_orchestrator.py tests/test_bounded_execution.py tests/test_capability_profiles.py tests/test_mcp_bridge_protocol.py tests/test_strict_isolation.py"],"summary":"Owner direction 2026-09-28 (#814): basic settings are readable and changeable in conversation, not only in the Settings page. Phase 1 bounded scope: SettingsOrchestrator (#506) gains current_context (enabled, timezone), owner_model (#805 upkeep enabled, daily call cap), judgment_ai (mode, model among listed models) and main_ai (route among connected and checked routes, model) through the service's existing setters only; the worker gets settings_read (effect-free) and settings_change (a digest-bound draft that never applies itself), relayed on trusted-local and unavailable on strict/isolated; the owner confirms with a Telegram button bound to the Work's exact drafts or /settings \ud655\uc778 <id>. No credentials, keys or endpoints by conversation. Text confirmation needs an owner-typed message; a setter that only queues is reported as requested; a probing/qualifying setter runs off-thread with a follow-up. A typed yes and onboarding are follow-ups."},{"id":"OWNER-MODEL-04","milestone":"Secretary follow-through (owner-directed)","issue":818,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_memory_candidate_confirm.py tests/test_refused_write_outcome.py tests/test_truthful_terminal_result.py tests/test_orchestrator.py tests/test_no_scenario_code.py"],"summary":"Owner feedback 2026-09-28 (Works 18c91ca7 and 7767e7da: a stated workplace and a lunch already eaten each became a pending MemoryCandidate that counted as a failed action, so the owner saw only a failure and no answer). Bounded scope: a save_memory held as a pending candidate is a recorded proposal, not a withheld answer or a failed outcome (a write that errored still counts); after the Telegram reply one message lists that Work's pending candidates with one-tap confirm/decline through the existing owner approval path (#659 button pattern); save_memory content is the value in the owner's own words; owner statements get a secretary's response in the plan question and core instructions. No new store, dependency or task-specific logic."},{"id":"EVAL-LOOP-01","milestone":"Secretary follow-through (owner-directed)","issue":821,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"evals/README.md","tests":["python3 -m pytest -q tests/test_eval_loop.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-28: find failures by machine, not case by case by the owner. Bounded first slice: a development-only evaluation loop under evals/ that adopts Inspect AI (MIT, UK AISI, 0.3.271, eval-only requirements, never imported by src/personal_agent). AgentOS is driven as a black box over its local HTTP API. Each multi-turn scenario runs in a fresh sandbox copied from a sanitized seed of the owner profile; the seed drops Telegram, connectors and folders, and the sandbox gets its own port and engine-run folder and has PyObjC blocked so no window opens. Workers are split between Codex and Claude Code. Scoring is deterministic checks (delivered, not failed, expected memory/candidate, reminder) plus a secretary-rubric judge on an owner-configured API key with a daily spend cap. Each sweep writes a JSON and markdown trend report outside the repository that clusters failures by root cause. The repository holds 21 synthetic scenarios; owner-derived scenarios stay in the local eval folder. No runtime, authority or dependency change to AgentOS itself; no scheduler installed."},{"id":"EVAL-LIMIT-01","milestone":"Secretary follow-through (owner-directed)","issue":887,"kind":"implementation","activation_status":"owner-directed-followup","depends_on":["EVAL-LOOP-01"],"contract":"evals/README.md","tests":["python3 -m pytest -q tests/test_eval_loop.py tests/test_no_scenario_code.py"],"summary":"Owner decision 2026-10-01 after the #842 sweeps: the eval is on-demand triage, not a scheduled loop or a pass-rate target. The owner's real use is the primary signal. Sweeps run after a batch of merged fixes, on the affected scenarios with 1 epoch; a full 3-epoch sweep is only for an improvement claim. No cron/launchd schedule; the 400\u2013500 runs/day target is on hold. Because the workers share the owner's live subscriptions, a sweep stops at the first usage-limit turn through Inspect's EarlyStopping hook (Adopt: runner.StopOnUsageLimit). No sandbox, worker turn or judge call starts after it, and sweep exits 2. Development tooling only; no runtime change and no scenario code."},{"id":"ARCH-THIN-01","milestone":"Secretary follow-through (owner-directed)","issue":820,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/request-path-rule-census.en.md","tests":["python3 -m pytest -q tests/test_orchestrator.py tests/test_agency_loop.py tests/test_truthful_terminal_result.py tests/test_refused_write_outcome.py tests/test_truth_integrity_history.py tests/test_memory_candidate_confirm.py tests/test_presence_eval_matrix.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-28 (#820: stop fixing failures case by case; find the root cause). Census of 63 request-path rules with the pilot invariant each protects (docs/request-path-rule-census.en.md). Every rule protecting secrets, payment approval, no replay / truthful unknown effects or Memory authority is kept, as are the private-document egress guards AGENTS.md requires; rules protecting nothing on the worker path are removed or reduced: the owner's words reach the worker verbatim with the conversation and owner model (a plan chooses worker, model and tools and may add notes, never a goal), the AI's answer is always delivered (answer withholding removed; only the unknown-effect statement replaces it), and one outcome judgment (did the reply serve the owner's message, given the conversation) decides the Work outcome; the second owner-input judgment and the plan-criteria checks are removed. Pre-worker intent-layer rules are listed as follow-up."},{"id":"EGRESS-OPEN-01","milestone":"Secretary follow-through (owner-directed)","issue":826,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/request-path-rule-census.en.md","tests":["python3 -m pytest -q tests/test_information_use.py tests/test_public_private_composition.py tests/test_private_provenance_egress.py tests/test_orchestrator.py tests/test_cli_route_agency.py tests/test_mcp_bridge_protocol.py tests/test_no_scenario_code.py"],"summary":"Owner decision 2026-09-28 (#826): remove the private-read/web-search separation (census class g: A6, A7, A8, A10, A12, A13, A14, A16) in exchange for a per-Work information-use audit. Private reads and the CLI's own or AgentOS web search share a turn; AgentOS-composed lookups keep the worker's words (stored secrets still dropped, withdrawn current-context text still removed); spliced material no longer pins the worker and the plan has no tool subset; find_files/read_file/list_roots/public_page_read are offered on trusted-local within the folder grants and page approval. Kept with negative tests: secrets, per-action payment approval (browser_session untouched), no replay/truthful unknown, #597 Memory authority, folder-grant scope. The audit is derived from turn_provenance (owner_information, workers), tool_events and decision_audit, stores references only, and is shown on the web task detail, at GET /api/tasks/<id>/information-use and through the read-only information_use tool. No new store or dependency."},{"id":"ARCH-THIN-02","milestone":"Secretary follow-through (owner-directed)","issue":832,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/request-path-rule-census.en.md","tests":["python3 -m pytest -q tests/test_intent_fallthrough.py tests/test_request_word_rules.py tests/test_presence_eval_matrix.py tests/test_eval_loop.py tests/test_owner_model_upkeep.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-28 (#832, C16): the pre-worker command/intent layer (census A25, B13, B14) falls through to the Work model loop instead of answering or failing before any AI runs. A natural-language rule decision reaches the worker as the owner's verbatim message plus a factual note (existing RULE_FALLTHROUGH path): an unavailable or unconnected calendar connector is a note, never CONNECTOR_UNAVAILABLE or a park; canned ambiguous/mixed/unsupported/missing-detail replies are notes; settings and note rules defer to the worker's own tools; a natural workspace summary keeps the owner's words; Telegram text over 12,000 characters reaches the worker truncated with a note. Kept terminal: explicit forms, approvals and #814 owner-typed settings confirmation, parked resume/retry/cancel, calendar-pending follow-ups, ready reads no worker tool can do (Gmail, saved knowledge/workspace results, Drive, a calendar draft on a connected calendar; empty results fall through), and installs with no usable AI route. Payment approval, secrets exclusion, effect idempotency/unknown and Memory authority unchanged. Eval harness: the state diff waits (bounded, 90 s) for the sandbox's owner-model upkeep queue to be idle, read from a new read-only running count on GET /api/owner-model."},{"id":"PRESENCE-TG-02","milestone":"Secretary follow-through (owner-directed)","issue":835,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_telegram_native_presence.py tests/test_live_progress.py tests/test_presence_eval_matrix.py tests/test_no_scenario_code.py"],"summary":"Owner feedback 2026-09-28 (#835: a fixed \ud83d\udc4d means nothing; '\uc0dd\uac01 \uc911' feels stiff; the header typing\u2026 ends too early). Presentation only: \ud83d\udc40 on the owner's message when the Work starts, replaced after the outcome is decided and the reply sent by an outcome-derived reaction (succeeded: \ud83d\udc4c, or \u270d when a note/Memory write was observed; partial, failed, unknown, cancelled, interrupted, uncertain delivery or anything still awaiting the owner's approval: the reaction is removed). Deterministic from the decided status and observed tool events, never from the owner's words or an extra model call; only documented Telegram reaction emoji. The waiting draft is a plain sendMessageDraft with cycling dots (step lines #718 kept, dots appended; never empty text), and typing\u2026 is refreshed every 4 s until the answer. Work/Event/Evidence/outcome semantics unchanged."},{"id":"PRESENCE-MEM-01","milestone":"Secretary follow-through (owner-directed)","issue":836,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_memory_candidate_confirm.py tests/test_owner_model_upkeep.py tests/test_refused_write_outcome.py tests/test_truthful_terminal_result.py tests/test_presence_eval_matrix.py tests/test_owner_profile.py tests/test_no_scenario_code.py"],"summary":"Owner feedback 2026-09-28 (#836): one memory ask per owner message, spoken as the secretary. Every MemoryCandidate of a Work (worker save_memory or #805 upkeep) is in one Telegram ask; a later candidate is added by editing the open ask (bound only once the edit is confirmed), or settled by the owner's earlier answer (yes via the owner approval path, recorded as by_answer provenance; no rejects); a yes never replaces an unseen current Memory and mixed answers reopen the ask. Upkeep sees what the Work already noted and drops proposals under its keys. The ask shows values, never keys; settled lines read naturally. The worker reads a held save_memory as a one-tap ask with no AgentOS/approval/candidate/storage wording (direct loop and MCP bridge); core instructions say to speak as the secretary; the Telegram not-yet-saved line is removed. Kept: #597 authority, secrets exclusion, truthfulness, no scenario code."},{"id":"ATTN-WAIT-01","milestone":"Secretary follow-through (owner-directed)","issue":839,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_attention_wait.py tests/test_telegram_native_presence.py tests/test_live_progress.py tests/test_information_use.py tests/test_preparations.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-28 (#839): use the waiting moment for attention. While a Telegram Work's dots draft (#835) is shown, one \"\ucc38, \u2026\" line surfaces one item AgentOS already prepared for the owner: a fresh prepared answer that did not reach the owner, else an accepted reminder due within 12 h, else a pending ask (proposed preparation, open memory ask). Deterministic from existing state, no model call, the current Work's own items excluded, 6 h cooldown per item (config row), at most one per Work, never during an approval/payment step, item text redacted. Presentation only: the item's durable surface and Work/outcome semantics are unchanged; each surfacing is a presence event in the Work's information-use audit. Kept: no scenario code, secrets exclusion, truthfulness."},{"id":"PRESENCE-WEB-01","milestone":"Secretary follow-through (owner-directed)","issue":845,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_web_typing_bubble.py tests/test_web_management_readiness.py tests/test_live_progress.py tests/test_presence_projection.py"],"summary":"Owner direction 2026-09-28 (#845): the web chat's response-wait state is a transient assistant typing bubble inside the conversation list (Telegram-style), not a status text. The agent half of an active Work's turn-pair renders the same .turn-body bubble with three staggered dots (opacity pulse under prefers-reduced-motion) and no status words; when the running Work has something to show, the observed step line the Telegram draft already uses (#718) sits above the dots and is replaced in place per poll, with extension points for a partial answer and the #839 attention line. Ephemeral UI state derived from the live task status on every render: never a Message/Event/status row, removed in the render that inserts the real reply, never on failed/cancelled/waiting Work, never restored on reload. Read-model addition only: task_progress carries step_line for active Work via the existing draft_step; no scenario code."},{"id":"ORCH-08","milestone":"Secretary follow-through (owner-directed)","issue":846,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_orchestrator.py tests/test_preparations.py tests/test_owner_model_upkeep.py tests/test_eval_loop.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-28 (#846): a standing wish about something that changes over time (price, availability, weather, delivery) is proposed as a when_needed watch through schedule_preparation, phrased as one question, with a default cadence of about three checks a day (every_minutes ~360-480 with until the deadline; hourly only when the owner asks or the deadline is within hours); the request sentence is never saved as a memory. Guidance (schedule_preparation and save_memory descriptions, CORE_INSTRUCTIONS, #805 upkeep QUESTION) plus one deterministic value check applied in owner_model.validate and at the save_memory boundary (content equal to the owner's request is refused; no intent detection). The generic watch window runs to the owner's deadline: until within 31 days of due, max_runs up to 96. Eval: two synthetic watch scenarios, an expect.no_memory_of_request check, and the judge sees a preparation's kind, cadence, deadline and delivery. Kept: no scenario code, C16 (the AI proposes; AgentOS validates the window), secrets exclusion, one ask per owner message."},{"id":"ORCH-10","milestone":"Secretary follow-through (owner-directed)","issue":860,"kind":"implementation","program":"SECRETARY-01","activation_status":"owner-directed-followup","depends_on":["ORCH-08"],"contract":"docs/secretary-agency-contract.en.md","tests":["python3 -m unittest discover -s tests -p 'test_preparations.py' -q","python3 -m unittest discover -s tests -p 'test_orchestrator.py' -q","python3 -m unittest discover -s tests -p 'test_no_scenario_code.py' -q","python3 scripts/verify_master_plan_docs.py","python3 scripts/verify_src_layout.py"],"owns":["src/personal_agent/quickstart_service.py","tests/test_preparations.py","src/personal_agent/agent_runtime.py","tests/test_orchestrator.py"],"summary":"Owner-directed follow-up to the observed #846 regression: a rejected bounded watch was followed by five same-goal daily one-shot preparations in one Work. Preserve the existing one-watch recurrence and owner-acceptance contract; correct the generic per-Work failed-window retry boundary without site/category code."},{"id":"PRESENCE-ANS-01","milestone":"Secretary follow-through (owner-directed)","issue":847,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_presence_projection.py tests/test_truthful_terminal_result.py tests/test_refused_write_outcome.py tests/test_truth_integrity_history.py tests/test_presence_eval_matrix.py tests/test_telegram_native_presence.py tests/test_no_scenario_code.py"],"summary":"Owner observation 2026-09-28 (#847, #848): the answer path must not narrate machinery, and Telegram must not deliver raw Markdown tables. #847: a failed/partial/interrupted Work with an AI answer delivers the answer first, closed by one short note (steps counted, a withheld step's own next step, the worker's question or next step as sentences); never a truth header, a tool name, a host action or an element-matching error. The note is recorded per Work (jobs.owner_note); the technical cause and owner-word cause stay on the record for \uc0c1\uc138, bubbles without an answer are unchanged, unknown keeps its statement and a failed state-changing step is never reported as done. #848: the #581 Telegram HTML formatter renders a Markdown table as one bold header line and one line per data row (cells joined with ' \u00b7 ', alignment separators dropped, bold/links kept), deterministically. Presentation only; no scenario code."},{"id":"JUDGE-FAIR-02","milestone":"Secretary follow-through (owner-directed)","issue":833,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/secretary-agency-contract.en.md","depends_on":["JUDGE-FAIR-01"],"tests":["python3 -m pytest -q tests/test_agency_loop.py tests/test_orchestrator.py tests/test_no_scenario_code.py"],"summary":"Follow-up to #829/#830 review P2: the direct-API route's outcome judgment (agent_runtime.goal_judgment, both the done-claim and the plain-final-reply sites) receives the same bounded, secret-redacted owner context (owner_profile + current_context snapshot the worker's system text carried, PROFILE_FACT_CHARS / CURRENT_CONTEXT_FACT_CHARS) that the orchestrator's judgment already reads, through one shared owner_context_fact helper; run_agent takes the turn context as owner_context and the service passes api_context. A profile- or clock-dependent answer is no longer judged against 'none' on the direct route. No new component; no scenario code."},{"id":"ORCH-09","milestone":"Secretary follow-through (owner-directed)","issue":854,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_orchestrator.py tests/test_search_providers.py tests/test_bounded_execution.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-29 (#854): Codex native web searches recorded no sources (35/35 live). Captured one real codex-cli 0.153.4 exec --json turn: the web_search item carries only query and action, no results, annotations or citations; the only URL is the model's markdown prose in the final agent_message. Kept as a sanitized fixture with a parser test proving native_searches records no invented source. Guidance (CORE_INSTRUCTIONS, CLI_NATIVE_SEARCH_GUIDANCE): a specific changing fact from a lookup carries its source link next to it; when the lookup returned no link the answer says the fact is unsourced instead of presenting it as checked. Watch tweak from ORCH-08 evidence (CORE_INSTRUCTIONS, schedule_preparation): a missing detail does not stop the watch proposal; propose with what is known and ask the detail in the same reply. Follow-up: prefer AgentOS-mediated web_search when sources must be Evidence. Kept: no scenario code, C16 (guidance and event parsing only), public_http_url filtering."},{"id":"OWNER-SETTINGS-02","milestone":"Secretary follow-through (owner-directed)","issue":855,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"docs/presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_owner_settings_conversation.py tests/test_settings_orchestrator.py tests/test_conversation_intent.py tests/test_web_management_readiness.py tests/test_no_scenario_code.py"],"summary":"Owner direction 2026-09-29 (#855, sweep evidence: '/settings \ud655\uc778 <id>' shown as the way to apply a time-zone change; the owner's '\uc751, \uadf8\ub807\uac8c \ubc14\uafd4' made a second draft). A settings draft pending in a conversation is confirmed by the owner's next owner-typed message when the DecisionEngine judges (over the pending change and the message) that it plainly confirms, or cancelled when it plainly declines; unavailable/neither leaves it pending and the message runs as a normal turn. The web chat turn that proposed the change shows the same \uc801\uc6a9/\ubc14\uafb8\uc9c0 \uc54a\uc74c buttons as Telegram through a Work-scoped route on the existing confirm/cancel path. No owner-facing string names a command (tool description, draft next_step, confirmation text); the typed \ud655\uc778/\ucde8\uc18c forms stay accepted silently. Kept: confirm-before-apply, digest/TTL/audit, owner_typed (#814 P1), no scenario code, C16."},{"id":"OWNER-MEMORY-01","milestone":"Secretary follow-through (owner-directed)","issue":862,"kind":"implementation","activation_status":"owner-directed-followup","contract":"secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_memory_service.py tests/test_memory_search.py tests/test_owner_model_upkeep.py tests/test_information_use.py","python3 -m pytest -q tests/test_no_scenario_code.py","python3 -m pytest -q tests/test_eval_loop.py"],"summary":"Owner direction 2026-09-29: improve cross-Work recall of existing saved Memory. Reuse owner-scoped MemoryService and #597 write/approval semantics; add bounded query-driven retrieval, expose profile snapshot omissions and record retrieved refs in the information-use audit. Transient current context stays distinct from durable Memory. No new store, dependency, data source, grant or scenario-specific branch."},{"id":"ENGINE-LIMIT-01","milestone":"Secretary follow-through (owner-directed)","issue":873,"kind":"implementation","activation_status":"owner-directed-followup","contract":"docs/presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_bounded_execution.py tests/test_decision_routes.py tests/test_no_scenario_code.py"],"summary":"Owner observation 2026-09-30 (Work 6dbf020e): after the Codex subscription hit its usage limit the secretary said only 'Codex \uc5d4\uc9c4\uc774 \uc791\uc5c5\uc744 \uc644\ub8cc\ud558\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4(\uc885\ub8cc \ucf54\ub4dc 1)'. The CLI states its limit without an HTTP status, so the status hints never fired. bounded_execution classifies the CLI's own usage-limit message as failure_class usage-limit (deterministic protocol classification like the signed-out check) and leads the failure message with one owner sentence: which subscription hit its limit, the reset time the CLI gave, and that the owner may switch to another AI until then; owner_cause (first sentence) therefore shows it. Judgment-AI CLI calls classify the same way for the route audit. Every status hint now leads its message. No retry, re-routing or remembered state; no scenario code."},{"id":"GOV-OSS-01","milestone":"Open-source role (owner-directed)","issue":875,"kind":"governance","activation_status":"complete-on-merge","contract":"development-constitution.en.md","tests":["python3 scripts/verify_master_plan_docs.py","python3 scripts/verify_src_layout.py","python3 -m pytest -q tests"],"summary":"Owner decision 2026-09-30 after OpenAI dots launched: AgentOS takes an explicit open-source role (open personal-memory interoperability, verifiable claims, contributor readiness, open research). Accepted sequencing: track C OSS-READY-01 #878 runs now as an owner-directed follow-up in parallel with SECRETARY-01; track A (Adopt Portable Memory for memory export/import, subject to a compatibility spike; imported items enter as MemoryCandidates) follows #794 OWNER-MODEL-01 and still needs its own goal-ready record; README positioning waits until track A ships something observable; tracks B and D remain proposals. next_goal and the SECRETARY-01 order (#660, then #661) are unchanged. No runtime change."},{"id":"OSS-READY-01","milestone":"Open-source role (owner-directed)","issue":878,"kind":"implementation","activation_status":"owner-directed-followup","depends_on":["GOV-OSS-01"],"contract":"development-constitution.en.md","tests":["python3 scripts/verify_master_plan_docs.py","python3 scripts/verify_src_layout.py","python3 -m pytest -q tests"],"summary":"GOV-OSS-01 track C: CONTRIBUTING.md (human guide linking AGENTS.md and the Constitution), SECURITY.md (GitHub private vulnerability reporting, supported versions, scope, honest pilot posture), outsider bug-report and idea issue templates, and historical root artifacts moved to docs/archive/root-history/ with an index and the two legacy writer scripts repointed. Docs, templates and file moves only; no runtime, authority or README change. A code of conduct waits for an owner-chosen enforcement contact."},{"id":"OSS-TIDY-01","milestone":"Open-source role (owner-directed)","issue":906,"kind":"implementation","activation_status":"owner-directed-followup","depends_on":["OSS-READY-01"],"contract":"development-constitution.en.md","tests":["python3 scripts/verify_master_plan_docs.py","python3 scripts/verify_readme_localization.py","python3 -m pytest -q tests"],"summary":"Owner direction 2026-09-30, continuing GOV-OSS-01 track C: shorter root (CODEX.md removed, output/ untracked), superseded concept documents (PRD.md, PRODUCT_VISION.ko.md, hub v2, assistant vision, b3os notes, context-capture idea) moved to docs/archive/concepts/ and finished one-off records to docs/archive/history/, each with an index; VISION.md becomes the one concept page with a map to the canonical documents; the duplicated #625 banner is kept only in AGENTS.md. The owner asked for the README (all four locales) to link VISION.md with the project's one-sentence statement as a quote; this is a concept link, not the open-source-role positioning that still waits for track A. Docs and file moves only; no runtime or authority change."},{"id":"GOV-SECRETARY-05","milestone":"Secretary Agency","issue":880,"kind":"governance","activation_status":"complete-on-merge","contract":"secretary-agency-contract.en.md","tests":["python3 scripts/verify_master_plan_docs.py","python3 scripts/verify_src_layout.py","python3 -m pytest -q tests"],"summary":"Record the 2026-09-30 owner decisions: order SEC-EVAL-01 #660 \u2192 OWNER-MODEL-01 #794 (phases 1\u20133) \u2192 GOV-OSS-01 #875 track A \u2192 SEC-A2A-01 #661; and pages exist for results text cannot carry and inputs conversation cannot safely carry, not for management (Presence Experience Contract principle 6, surface table and Pages section; successor note in the Local Web Management Contract). No runtime or web change."},{"id":"OWNER-MODEL-01","milestone":"Secretary Agency","issue":794,"kind":"implementation","activation_status":"parent-controlled","contract":"secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_memory_service.py tests/test_memory_continuity.py tests/test_memory_search.py tests/test_memory_save_undo.py tests/test_current_context.py tests/test_context_observations.py tests/test_owner_model_upkeep.py tests/test_information_use.py tests/test_no_scenario_code.py"],"summary":"Implement only remaining phase 3: conversation-first exact per-item correction and forget for owner Memory, current-state claims and observations, with durable content-free receipts. Apply #918 option B: retract from reuse immediately, allow an exact 7-day undo, then purge; an explicit complete-delete request purges without the waiting window. Reuse the journal (#886), source lookup (#896) and save/undo machinery (#972); do not reimplement them or #918 settings/family slice (b). Preserve current owner/third-party write boundaries, secrets, payment approvals and no-replay semantics. Bind changes to owner and exact item/version, prevent stale undo from overwriting later corrections, and keep retracted/deleted information out of current retrieval and derived reuse within the declared deletion scope. Prove restart/expiry/race behavior with injected transports and fake clocks; make no claim about deleting provider copies or all backups. Independent review is required before the owner-state implementation merges. Close #794 only on its actual phase-3 evidence; the next operating audit remains #660.","delivery_contract":"docs/owner-model-phase3-delivery.en.md","selected_by":{"issue":1021,"date":"2026-10-06","reason":"Owner requested current delivery planning after choosing the remaining #794 phase 3 as the n