hrough","issue":745,"kind":"implementation","activation_status":"owner-activated-goal-ready","depends_on":["UX-RENEW-01"],"contract":"presence-experience-contract.en.md","tests":["python3 -m pytest -q tests/test_settings_ui.py tests/test_ui_quality.py"],"summary":"Corrective follow-through to the owner-activated UX-RENEW-01 scope: materially clarify AI Settings route state and setup hierarchy after the owner reported that the merged AI screen still felt unchanged. Presentation-only; preserve API, credentials, qualification, activation, privacy, and provider behavior."},{"id":"UX-SPEC-02","milestone":"Owner-facing application settings specification","issue":766,"kind":"documentation","activation_status":"owner-activated-goal-ready","depends_on":["UX-AI-STATE-01"],"contract":"design/settings-ux-renewal-spec.en.md","tests":["python3 scripts/verify_master_plan_docs.py","python3 scripts/verify_assistant_execution.py --check-spec","python3 scripts/verify_src_layout.py"],"summary":"Owner-selected standalone documentation work (2026-09-28): specify compact application settings, truthful AI configuration/verification state, progressive account editing, accessibility, existing-code implementation mapping, acceptance evidence and rollback. English canonical specification plus Korean companion. Proposed UX-PREF-01 through UX-PREF-04 remain unactivated; no runtime successor or paused program is selected. Owner additionally requested an interactive design prototype, a logo-free single sidebar, independent AI role groups, plain file-access labels and restored language selection. Prototype only; no production runtime implementation.","authority":["docs/design/settings-ux-renewal-spec.en.md","docs/design/settings-ux-renewal-spec.ko.md","delivery-plan.yaml","docs/design/settings-ux-renewal-preview.html","docs/design/settings-ux-renewal-preview/"],"non_goals":["runtime implementation","credential/API/authority changes","new dependency or UI framework","activation of proposed implementation units"],"work_units":["Inspect current main and owner evidence; review existing solutions","Write canonical specification, Korean companion and standalone interactive design prototype","Validate documents and complete the issue-linked PR"],"completion_rule":"Specification artifacts and required documentation/CI checks are delivered through the issue-linked merged PR. This is design evidence only, not implemented UI or owner acceptance."},{"id":"OWNER-STATE-01","milestone":"Secretary follow-through (owner-directed)","issue":774,"kind":"implementation","activation_status":"owner-activated-goal-ready","contract":"secretary-agency-contract.en.md","tests":["python3 -m pytest -q tests/test_orchestrator.py tests/test_bounded_execution.py tests/test_mcp_bridge_protocol.py tests/test_capability_profiles.py tests/test_strict_isolation.py"],"summary":"Owner direction 2026-09-28 in the Telegram/Claude session: the owner had asked for Telegram location checking and expected the secretary to remember where they live, know what is scheduled and remind them to leave for a stated tee time; the owner then directed 'fix and merge on your own'. Bounded scope: relay the existing Memory, calendar and preparation actions to the service on the trusted-local CLI route (step 1), and a generic owner location request that continues the asking Work once (step 2), both under the unchanged #597 memory approval, calendar previews, #659 preparation acceptance and #678 private/search separation. Non-goals: new stores, default-on current context, site- or task-specific logic."},{"id":"GOV-SECRETARY-04","milestone":"Secretary Agency","issue":770,"kind":"governance","activation_status":"complete-on-merge","contract":"secretary-agency-contract.en.md","tests":["python3 scripts/verify_master_plan_docs.py","python3 scripts/verify_src_layout.py","python3 -m pytest -q tests"],"summary":"Resume SECRETARY-01 by owner decision after UX-RENEW-01 closed out: next_goal, program and iteration records return t