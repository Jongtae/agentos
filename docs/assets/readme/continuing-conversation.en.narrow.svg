<svg xmlns="http://www.w3.org/2000/svg" width="420" height="980" viewBox="0 0 420 980" role="img" aria-labelledby="title desc">
<title id="title">A conversation over time</title><desc id="desc">Illustrative, condensed; not one observed live run.</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="420" height="980" fill="#fff"/>
<text x="20" y="32.0" font-size="23" class="bold" text-anchor="start">A conversation over time</text>
<text x="20" y="68" font-size="16" class="muted" text-anchor="start">Representative interaction · product direction</text>
<rect x="40" y="92" width="360" height="220" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="122" font-size="18" class="blue bold" text-anchor="start">01  Earlier</text>
<text x="56" y="158.0" font-size="19" class="bold" text-anchor="start">“We’re almost out of coffee.”</text>
<path d="M56 250H384" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="56" y="278.0" font-size="17" class="muted" text-anchor="start">Eligible prior context</text>
<circle cx="20" cy="118" r="4" fill="#245b92"/>
<path d="M20 127 L20 350" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M16 345 L20 350 L24 345" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="336" width="360" height="220" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="366" font-size="18" class="blue bold" text-anchor="start">02  Hours later</text>
<text x="56" y="402.0" font-size="19" class="bold" text-anchor="start">“I’m heading out now. Is</text>
<text x="56" y="428.6" font-size="19" class="bold" text-anchor="start">there somewhere on the way I</text>
<text x="56" y="455.2" font-size="19" class="bold" text-anchor="start">can pick it up?”</text>
<path d="M56 494H384" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="56" y="522.0" font-size="17" class="muted" text-anchor="start">Time / route / availability</text>
<circle cx="20" cy="362" r="4" fill="#245b92"/>
<path d="M20 371 L20 594" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M16 589 L20 594 L24 589" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="580" width="360" height="220" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="610" font-size="18" class="blue bold" text-anchor="start">03  Later</text>
<text x="56" y="646.0" font-size="19" class="bold" text-anchor="start">“No time. Just get the same</text>
<text x="56" y="672.6" font-size="19" class="bold" text-anchor="start">one as last time.”</text>
<path d="M56 738H384" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="56" y="766.0" font-size="17" class="muted" text-anchor="start">Prior choice / authority when</text>
<text x="56" y="789.8" font-size="17" class="muted" text-anchor="start">needed</text>
<circle cx="20" cy="606" r="4" fill="#245b92"/>
<rect x="20" y="836" width="380" height="58" rx="5" fill="#f2f7fc" stroke="#96b6d6"/>
<text x="210.0" y="861" font-size="18" class="bold" text-anchor="middle">One continuing Work, resolved</text>
<text x="210.0" y="884" font-size="18" class="bold" text-anchor="middle">beneath the conversation</text>
<text x="20" y="934.0" font-size="16" class="muted" text-anchor="start">Illustrative, condensed; not one</text>
<text x="20" y="956.4" font-size="16" class="muted" text-anchor="start">observed live run.</text>
</svg>
