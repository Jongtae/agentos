<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1414" viewBox="0 0 840 1414" role="img" aria-labelledby="title desc">
<title id="title">A conversation over time</title><desc id="desc">Reconstructed product direction, not one observed live run or a shipped shopping integration.</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="840" height="1414" fill="#fff"/>
<text x="20" y="32.0" font-size="23" class="bold" text-anchor="start">A conversation over time</text>
<text x="20" y="68" font-size="16" class="muted" text-anchor="start">Representative interaction · product direction</text>
<text x="20" y="96.0" font-size="17" class="muted" text-anchor="start">Illustrated conditions: prior coffee choice is available; route and account</text>
<text x="20" y="119.8" font-size="17" class="muted" text-anchor="start">access are missing.</text>
<rect x="20" y="161.6" width="500" height="224.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="189.6" font-size="19" class="blue bold" text-anchor="start">Earlier</text>
<text x="36" y="224.2" font-size="16" class="muted" text-anchor="start">Owner</text>
<text x="36" y="250.2" font-size="20" class="bold" text-anchor="start">“We’re almost out of coffee.”</text>
<text x="36" y="290.2" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="316.2" font-size="20" class="" text-anchor="start">“I’ll keep coffee in mind for your next</text>
<text x="36" y="344.2" font-size="20" class="" text-anchor="start">shop.”</text>
<rect x="548" y="161.6" width="272" height="224.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 273.9 L544 273.9" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 269.9 L544 273.9 L539 277.9" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="187.6" font-size="17" class="blue bold" text-anchor="start">What AgentOS resolves</text>
<text x="564" y="219.39999999999998" font-size="18" class="" text-anchor="start">Keep eligible context;</text>
<text x="564" y="244.59999999999997" font-size="18" class="" text-anchor="start">sharing a fact does</text>
<text x="564" y="269.79999999999995" font-size="18" class="" text-anchor="start">not authorize a</text>
<text x="564" y="295.0" font-size="18" class="" text-anchor="start">purchase.</text>
<path d="M270 390.2 L270 404.2" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M266 399.2 L270 404.2 L274 399.2" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="20" y="410.2" width="500" height="252.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="438.2" font-size="19" class="blue bold" text-anchor="start">Hours later</text>
<text x="36" y="472.79999999999995" font-size="16" class="muted" text-anchor="start">Owner</text>
<text x="36" y="498.79999999999995" font-size="20" class="bold" text-anchor="start">“I’m heading out now. Is there</text>
<text x="36" y="526.8" font-size="20" class="bold" text-anchor="start">somewhere on the way I can pick it up?”</text>
<text x="36" y="566.8" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="592.8" font-size="20" class="" text-anchor="start">“The coffee? Share your route and I’ll</text>
<text x="36" y="620.8" font-size="20" class="" text-anchor="start">look for a convenient stop.”</text>
<rect x="548" y="410.2" width="272" height="252.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 536.5 L544 536.5" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 532.5 L544 536.5 L539 540.5" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="436.2" font-size="17" class="blue bold" text-anchor="start">What AgentOS resolves</text>
<text x="564" y="468.0" font-size="18" class="" text-anchor="start">Resolve “it” from</text>
<text x="564" y="493.2" font-size="18" class="" text-anchor="start">earlier context. Ask</text>
<text x="564" y="518.4" font-size="18" class="" text-anchor="start">for the route only</text>
<text x="564" y="543.6" font-size="18" class="" text-anchor="start">because it is missing.</text>
<path d="M270 666.8 L270 680.8" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M266 675.8 L270 680.8 L274 675.8" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="20" y="686.8" width="500" height="280.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="714.8" font-size="19" class="blue bold" text-anchor="start">Later</text>
<text x="36" y="749.4" font-size="16" class="muted" text-anchor="start">Owner</text>
<text x="36" y="775.4" font-size="20" class="bold" text-anchor="start">“No time. Just get the same one as last</text>
<text x="36" y="803.4" font-size="20" class="bold" text-anchor="start">time.”</text>
<text x="36" y="843.4" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="869.4" font-size="20" class="" text-anchor="start">“The coffee from last time. Connect</text>
<text x="36" y="897.4" font-size="20" class="" text-anchor="start">your shopping account here so I can</text>
<text x="36" y="925.4" font-size="20" class="" text-anchor="start">prepare the order.”</text>
<rect x="548" y="686.8" width="272" height="280.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 827.0999999999999 L544 827.0999999999999" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 823.0999999999999 L544 827.0999999999999 L539 831.0999999999999" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="712.8" font-size="17" class="blue bold" text-anchor="start">What AgentOS resolves</text>
<text x="564" y="744.5999999999999" font-size="18" class="" text-anchor="start">Resolve the prior</text>
<text x="564" y="769.8" font-size="18" class="" text-anchor="start">choice. Pause the</text>
<text x="564" y="794.9999999999999" font-size="18" class="" text-anchor="start">shopping Work for the</text>
<text x="564" y="820.1999999999999" font-size="18" class="" text-anchor="start">missing account</text>
<text x="564" y="845.3999999999999" font-size="18" class="" text-anchor="start">authority.</text>
<path d="M270 971.4 L270 985.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M266 980.4 L270 985.4 L274 980.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="20" y="991.4" width="500" height="252.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="1019.4" font-size="19" class="blue bold" text-anchor="start">After connecting the account</text>
<text x="36" y="1054.0" font-size="16" class="muted" text-anchor="start">Owner</text>
<text x="36" y="1080.0" font-size="20" class="bold" text-anchor="start">“Connected.”</text>
<text x="36" y="1120.0" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="1146.0" font-size="20" class="" text-anchor="start">“Back to that coffee. I’ll prepare the</text>
<text x="36" y="1174.0" font-size="20" class="" text-anchor="start">order for your review; payment needs</text>
<text x="36" y="1202.0" font-size="20" class="" text-anchor="start">your approval.”</text>
<rect x="548" y="991.4" width="272" height="252.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 1117.7 L544 1117.7" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 1113.7 L544 1117.7 L539 1121.7" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="1017.4" font-size="17" class="blue bold" text-anchor="start">What AgentOS resolves</text>
<text x="564" y="1049.2" font-size="18" class="" text-anchor="start">Resume the original</text>
<text x="564" y="1074.4" font-size="18" class="" text-anchor="start">Work after the</text>
<text x="564" y="1099.6000000000001" font-size="18" class="" text-anchor="start">handoff. Account</text>
<text x="564" y="1124.8" font-size="18" class="" text-anchor="start">access is not payment</text>
<text x="564" y="1150.0" font-size="18" class="" text-anchor="start">approval.</text>
<rect x="20" y="1268.0" width="800" height="54.599999999999994" rx="5" fill="#f2f7fc" stroke="#96b6d6"/>
<text x="36" y="1296.0" font-size="19" class="bold" text-anchor="start">Context persists. The shopping Work resumes after the handoff.</text>
<text x="20" y="1354.6" font-size="17" class="muted" text-anchor="start">Reconstructed product direction, not one observed live run or a shipped</text>
<text x="20" y="1378.3999999999999" font-size="17" class="muted" text-anchor="start">shopping integration.</text>
</svg>
