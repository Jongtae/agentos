<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1943" viewBox="0 0 420 1943" role="img" aria-labelledby="title desc">
<title id="title">시간에 걸쳐 이어지는 대화</title><desc id="desc">제품 방향을 재구성한 예시입니다. 하나의 실제 관찰 실행이나 배포된 구매 기능이 아닙니다.</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="420" height="1943" fill="#fff"/>
<text x="20" y="32.0" font-size="23" class="bold" text-anchor="start">시간에 걸쳐 이어지는 대화</text>
<text x="20" y="68" font-size="16" class="muted" text-anchor="start">대표 상호작용 · 제품 방향</text>
<text x="20" y="96.0" font-size="17" class="muted" text-anchor="start">예시 조건: 지난번 커피 선택은 남아 있고,</text>
<text x="20" y="119.8" font-size="17" class="muted" text-anchor="start">이동 경로와 구매 계정 권한은 아직 없습니다.</text>
<rect x="40" y="161.6" width="360" height="324.79999999999995" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="189.6" font-size="19" class="blue bold" text-anchor="start">처음에</text>
<text x="56" y="224.2" font-size="16" class="muted" text-anchor="start">소유자</text>
<text x="56" y="250.2" font-size="20" class="bold" text-anchor="start">“커피 거의 다 떨어졌네.”</text>
<text x="56" y="290.2" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="56" y="316.2" font-size="20" class="" text-anchor="start">“다음에 장 볼 때 커피도 챙기면</text>
<text x="56" y="344.2" font-size="20" class="" text-anchor="start">되겠네요.”</text>
<rect x="40" y="386.2" width="360" height="100.19999999999996" rx="5" fill="#f2f7fc" stroke="#ccd8e6"/>
<text x="56" y="412.2" font-size="17" class="blue bold" text-anchor="start">AgentOS가 아래에서 해석하는 것</text>
<text x="56" y="444.0" font-size="18" class="" text-anchor="start">저장 가능한 맥락을 남긴다. 일상적인</text>
<text x="56" y="469.2" font-size="18" class="" text-anchor="start">사실 공유가 구매 권한은 아니다.</text>
<circle cx="20" cy="185.6" r="4" fill="#245b92"/>
<path d="M20 195.6 L20 522.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M16 517.4 L20 522.4 L24 517.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="510.4" width="360" height="406.0" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="538.4" font-size="19" class="blue bold" text-anchor="start">몇 시간 뒤</text>
<text x="56" y="573.0" font-size="16" class="muted" text-anchor="start">소유자</text>
<text x="56" y="599.0" font-size="20" class="bold" text-anchor="start">“이제 나가려고. 가는 길에 살</text>
<text x="56" y="627.0" font-size="20" class="bold" text-anchor="start">만한 데 있을까?”</text>
<text x="56" y="667.0" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="56" y="693.0" font-size="20" class="" text-anchor="start">“커피 말씀이죠? 이동 경로를</text>
<text x="56" y="721.0" font-size="20" class="" text-anchor="start">알려주시면 들르기 편한 곳을</text>
<text x="56" y="749.0" font-size="20" class="" text-anchor="start">찾아볼게요.”</text>
<rect x="40" y="791.0" width="360" height="125.39999999999998" rx="5" fill="#f2f7fc" stroke="#ccd8e6"/>
<text x="56" y="817.0" font-size="17" class="blue bold" text-anchor="start">AgentOS가 아래에서 해석하는 것</text>
<text x="56" y="848.8" font-size="18" class="" text-anchor="start">이전 맥락에서 커피를 이어받는다.</text>
<text x="56" y="874.0" font-size="18" class="" text-anchor="start">모르는 이동 경로만 필요해진 순간</text>
<text x="56" y="899.1999999999999" font-size="18" class="" text-anchor="start">묻는다.</text>
<circle cx="20" cy="534.4" r="4" fill="#245b92"/>
<path d="M20 544.4 L20 952.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M16 947.4 L20 952.4 L24 947.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="940.4" width="360" height="406.0" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="968.4" font-size="19" class="blue bold" text-anchor="start">나중에</text>
<text x="56" y="1003.0" font-size="16" class="muted" text-anchor="start">소유자</text>
<text x="56" y="1029.0" font-size="20" class="bold" text-anchor="start">“시간 없네. 지난번에 사던 걸로</text>
<text x="56" y="1057.0" font-size="20" class="bold" text-anchor="start">그냥 사줘.”</text>
<text x="56" y="1097.0" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="56" y="1123.0" font-size="20" class="" text-anchor="start">“지난번 커피로요. 주문을</text>
<text x="56" y="1151.0" font-size="20" class="" text-anchor="start">준비하려면 구매 계정이 필요해요.</text>
<text x="56" y="1179.0" font-size="20" class="" text-anchor="start">여기서 연결해주세요.”</text>
<rect x="40" y="1221.0" width="360" height="125.39999999999998" rx="5" fill="#f2f7fc" stroke="#ccd8e6"/>
<text x="56" y="1247.0" font-size="17" class="blue bold" text-anchor="start">AgentOS가 아래에서 해석하는 것</text>
<text x="56" y="1278.8" font-size="18" class="" text-anchor="start">이전 선택을 찾는다. 구매 계정</text>
<text x="56" y="1304.0" font-size="18" class="" text-anchor="start">권한이 없어 해당 Work를 잠시</text>
<text x="56" y="1329.2" font-size="18" class="" text-anchor="start">멈춘다.</text>
<circle cx="20" cy="964.4" r="4" fill="#245b92"/>
<path d="M20 974.4 L20 1382.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M16 1377.4 L20 1382.4 L24 1377.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="1370.4" width="360" height="352.79999999999995" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="1398.4" font-size="19" class="blue bold" text-anchor="start">계정 연결 뒤</text>
<text x="56" y="1433.0" font-size="16" class="muted" text-anchor="start">소유자</text>
<text x="56" y="1459.0" font-size="20" class="bold" text-anchor="start">“연결했어.”</text>
<text x="56" y="1499.0" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="56" y="1525.0" font-size="20" class="" text-anchor="start">“그 커피로 이어서 주문을</text>
<text x="56" y="1553.0" font-size="20" class="" text-anchor="start">준비할게요. 결제 전에는</text>
<text x="56" y="1581.0" font-size="20" class="" text-anchor="start">확인받을게요.”</text>
<rect x="40" y="1623.0" width="360" height="100.19999999999996" rx="5" fill="#f2f7fc" stroke="#ccd8e6"/>
<text x="56" y="1649.0" font-size="17" class="blue bold" text-anchor="start">AgentOS가 아래에서 해석하는 것</text>
<text x="56" y="1680.8" font-size="18" class="" text-anchor="start">권한 연결 뒤 원래 Work를 재개한다.</text>
<text x="56" y="1706.0" font-size="18" class="" text-anchor="start">계정 연결과 결제 승인은 별개다.</text>
<circle cx="20" cy="1394.4" r="4" fill="#245b92"/>
<rect x="20" y="1747.2" width="380" height="81.19999999999999" rx="5" fill="#f2f7fc" stroke="#96b6d6"/>
<text x="36" y="1775.2" font-size="19" class="bold" text-anchor="start">맥락은 남고, 권한 연결 뒤 원래 구매</text>
<text x="36" y="1801.8" font-size="19" class="bold" text-anchor="start">Work를 이어갑니다.</text>
<text x="20" y="1860.4" font-size="17" class="muted" text-anchor="start">제품 방향을 재구성한 예시입니다. 하나의</text>
<text x="20" y="1884.2" font-size="17" class="muted" text-anchor="start">실제 관찰 실행이나 배포된 구매 기능이</text>
<text x="20" y="1908.0" font-size="17" class="muted" text-anchor="start">아닙니다.</text>
</svg>
