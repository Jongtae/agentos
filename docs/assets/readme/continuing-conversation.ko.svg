<svg xmlns="http://www.w3.org/2000/svg" width="840" height="550" viewBox="0 0 840 550" role="img" aria-labelledby="title desc">
<title id="title">시간에 걸쳐 이어지는 대화</title><desc id="desc">축약한 설명용 예시이며, 하나의 실제 관찰 실행이 아닙니다.</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="840" height="550" fill="#fff"/>
<text x="20" y="32.0" font-size="23" class="bold" text-anchor="start">시간에 걸쳐 이어지는 대화</text>
<text x="20" y="68" font-size="16" class="muted" text-anchor="start">대표 상호작용 · 제품 방향</text>
<rect x="20" y="92" width="256" height="310" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="122" font-size="18" class="blue bold" text-anchor="start">01  처음에</text>
<text x="36" y="158.0" font-size="19" class="bold" text-anchor="start">“커피 거의 다 떨어졌네</text>
<text x="36" y="184.6" font-size="19" class="bold" text-anchor="start">.”</text>
<path d="M36 290H260" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="36" y="318.0" font-size="17" class="muted" text-anchor="start">저장 가능한 이전 맥락</text>
<path d="M278 210 L290 210" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M285 206 L290 210 L285 214" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="292" y="92" width="256" height="310" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="308" y="122" font-size="18" class="blue bold" text-anchor="start">02  몇 시간 뒤</text>
<text x="308" y="158.0" font-size="19" class="bold" text-anchor="start">“이제 나가려고. 가는</text>
<text x="308" y="184.6" font-size="19" class="bold" text-anchor="start">길에 살 만한 데 있을까</text>
<text x="308" y="211.2" font-size="19" class="bold" text-anchor="start">?”</text>
<path d="M308 290H532" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="308" y="318.0" font-size="17" class="muted" text-anchor="start">시간 / 경로 / 영업 여부</text>
<path d="M550 210 L562 210" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M557 206 L562 210 L557 214" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="564" y="92" width="256" height="310" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="580" y="122" font-size="18" class="blue bold" text-anchor="start">03  나중에</text>
<text x="580" y="158.0" font-size="19" class="bold" text-anchor="start">“시간 없네. 지난번에</text>
<text x="580" y="184.6" font-size="19" class="bold" text-anchor="start">사던 걸로 그냥 사줘.”</text>
<path d="M580 290H804" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="580" y="318.0" font-size="17" class="muted" text-anchor="start">이전 선택 / 필요할 때 권</text>
<text x="580" y="341.8" font-size="17" class="muted" text-anchor="start">한</text>
<rect x="20" y="422" width="800" height="58" rx="5" fill="#f2f7fc" stroke="#96b6d6"/>
<text x="420.0" y="447" font-size="18" class="bold" text-anchor="middle">대화 아래에서 맥락을 연결하며 이어가는 하나의 Work</text>
<text x="20" y="527.0" font-size="16" class="muted" text-anchor="start">축약한 설명용 예시이며, 하나의 실제 관찰 실행이 아닙니다.</text>
</svg>
