<svg xmlns="http://www.w3.org/2000/svg" width="420" height="980" viewBox="0 0 420 980" role="img" aria-labelledby="title desc">
<title id="title">相隔数小时，仍是同一段对话</title><desc id="desc">经过浓缩的说明示例，并非一次真实观测的运行。</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="420" height="980" fill="#fff"/>
<text x="20" y="32.0" font-size="23" class="bold" text-anchor="start">相隔数小时，仍是同一段对话</text>
<text x="20" y="68" font-size="16" class="muted" text-anchor="start">代表性交互 · 产品方向</text>
<rect x="40" y="92" width="360" height="220" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="122" font-size="18" class="blue bold" text-anchor="start">01  起初</text>
<text x="56" y="158.0" font-size="19" class="bold" text-anchor="start">“咖啡快没了。”</text>
<path d="M56 250H384" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="56" y="278.0" font-size="17" class="muted" text-anchor="start">符合保存条件的既有上下文</text>
<circle cx="20" cy="118" r="4" fill="#245b92"/>
<path d="M20 127 L20 350" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M16 345 L20 350 L24 345" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="336" width="360" height="220" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="366" font-size="18" class="blue bold" text-anchor="start">02  数小时后</text>
<text x="56" y="402.0" font-size="19" class="bold" text-anchor="start">“我现在出门，顺路有地方可以买到</text>
<text x="56" y="428.6" font-size="19" class="bold" text-anchor="start">吗？”</text>
<path d="M56 494H384" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="56" y="522.0" font-size="17" class="muted" text-anchor="start">时间 / 路线 / 营业情况</text>
<circle cx="20" cy="362" r="4" fill="#245b92"/>
<path d="M20 371 L20 594" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M16 589 L20 594 L24 589" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="580" width="360" height="220" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="56" y="610" font-size="18" class="blue bold" text-anchor="start">03  之后</text>
<text x="56" y="646.0" font-size="19" class="bold" text-anchor="start">“没时间了，买上次那款就好。”</text>
<path d="M56 738H384" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="56" y="766.0" font-size="17" class="muted" text-anchor="start">先前选择 / 需要时取得权限</text>
<circle cx="20" cy="606" r="4" fill="#245b92"/>
<rect x="20" y="836" width="380" height="58" rx="5" fill="#f2f7fc" stroke="#96b6d6"/>
<text x="210.0" y="861" font-size="18" class="bold" text-anchor="middle">在对话之下连接上下文，延续同一个 Work</text>
<text x="20" y="934.0" font-size="16" class="muted" text-anchor="start">经过浓缩的说明示例，并非一次真实观测的运行。</text>
</svg>
