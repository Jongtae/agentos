<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1198" viewBox="0 0 840 1198" role="img" aria-labelledby="title desc">
<title id="title">相隔数小时，仍是同一段对话</title><desc id="desc">重构的产品方向示例，并非一次真实观测，也不代表已发布的购物功能。</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="840" height="1198" fill="#fff"/>
<text x="20" y="32.0" font-size="23" class="bold" text-anchor="start">相隔数小时，仍是同一段对话</text>
<text x="20" y="68" font-size="16" class="muted" text-anchor="start">代表性交互 · 产品方向</text>
<text x="20" y="96.0" font-size="17" class="muted" text-anchor="start">示例条件：保留了上次的咖啡选择，但尚不知道路线，也没有购物账户权限。</text>
<rect x="20" y="137.8" width="500" height="196.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="165.8" font-size="19" class="blue bold" text-anchor="start">起初</text>
<text x="36" y="200.4" font-size="16" class="muted" text-anchor="start">所有者</text>
<text x="36" y="226.4" font-size="20" class="bold" text-anchor="start">“咖啡快没了。”</text>
<text x="36" y="266.4" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="292.4" font-size="20" class="" text-anchor="start">“下次买东西时，也得补上咖啡。”</text>
<rect x="548" y="137.8" width="272" height="196.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 236.10000000000002 L544 236.10000000000002" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 232.10000000000002 L544 236.10000000000002 L539 240.10000000000002" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="163.8" font-size="17" class="blue bold" text-anchor="start">AgentOS 在对话之下解析什么</text>
<text x="564" y="195.60000000000002" font-size="18" class="" text-anchor="start">保留符合保存条件的上下文。</text>
<text x="564" y="220.8" font-size="18" class="" text-anchor="start">分享日常事实并不等于授权购</text>
<text x="564" y="246.00000000000003" font-size="18" class="" text-anchor="start">买。</text>
<path d="M270 338.4 L270 352.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M266 347.4 L270 352.4 L274 347.4" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="20" y="358.4" width="500" height="224.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="386.4" font-size="19" class="blue bold" text-anchor="start">数小时后</text>
<text x="36" y="421.0" font-size="16" class="muted" text-anchor="start">所有者</text>
<text x="36" y="447.0" font-size="20" class="bold" text-anchor="start">“我现在出门，顺路有地方可以买到吗？”</text>
<text x="36" y="487.0" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="513.0" font-size="20" class="" text-anchor="start">“是说咖啡吧？告诉我路线，我来找方便顺路停留的</text>
<text x="36" y="541.0" font-size="20" class="" text-anchor="start">店。”</text>
<rect x="548" y="358.4" width="272" height="224.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 470.7 L544 470.7" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 466.7 L544 470.7 L539 474.7" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="384.4" font-size="17" class="blue bold" text-anchor="start">AgentOS 在对话之下解析什么</text>
<text x="564" y="416.2" font-size="18" class="" text-anchor="start">从先前的上下文理解是在说咖</text>
<text x="564" y="441.4" font-size="18" class="" text-anchor="start">啡。只在需要时询问尚缺的路</text>
<text x="564" y="466.59999999999997" font-size="18" class="" text-anchor="start">线。</text>
<path d="M270 587.0 L270 601.0" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M266 596.0 L270 601.0 L274 596.0" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="20" y="607.0" width="500" height="224.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="635.0" font-size="19" class="blue bold" text-anchor="start">之后</text>
<text x="36" y="669.6" font-size="16" class="muted" text-anchor="start">所有者</text>
<text x="36" y="695.6" font-size="20" class="bold" text-anchor="start">“没时间了，买上次那款就好。”</text>
<text x="36" y="735.6" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="761.6" font-size="20" class="" text-anchor="start">“上次那款咖啡。准备订单需要你的购物账户，请在</text>
<text x="36" y="789.6" font-size="20" class="" text-anchor="start">这里连接。”</text>
<rect x="548" y="607.0" width="272" height="224.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 719.3 L544 719.3" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 715.3 L544 719.3 L539 723.3" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="633.0" font-size="17" class="blue bold" text-anchor="start">AgentOS 在对话之下解析什么</text>
<text x="564" y="664.8" font-size="18" class="" text-anchor="start">找到先前的选择。购物账户权</text>
<text x="564" y="690.0" font-size="18" class="" text-anchor="start">限尚缺，暂时暂停这个</text>
<text x="564" y="715.1999999999999" font-size="18" class="" text-anchor="start">Work。</text>
<path d="M270 835.6 L270 849.6" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M266 844.6 L270 849.6 L274 844.6" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="20" y="855.6" width="500" height="196.6" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="36" y="883.6" font-size="19" class="blue bold" text-anchor="start">连接账户后</text>
<text x="36" y="918.2" font-size="16" class="muted" text-anchor="start">所有者</text>
<text x="36" y="944.2" font-size="20" class="bold" text-anchor="start">“连接好了。”</text>
<text x="36" y="984.2" font-size="16" class="blue bold" text-anchor="start">PA</text>
<text x="36" y="1010.2" font-size="20" class="" text-anchor="start">“继续准备那款咖啡的订单，付款前会请你确认。”</text>
<rect x="548" y="855.6" width="272" height="196.6" rx="8" fill="#f2f7fc" stroke="#ccd8e6"/>
<path d="M524 953.9 L544 953.9" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M539 949.9 L544 953.9 L539 957.9" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="564" y="881.6" font-size="17" class="blue bold" text-anchor="start">AgentOS 在对话之下解析什么</text>
<text x="564" y="913.4" font-size="18" class="" text-anchor="start">权限交接后恢复原来的</text>
<text x="564" y="938.6" font-size="18" class="" text-anchor="start">Work。连接账户不等于批准</text>
<text x="564" y="963.8" font-size="18" class="" text-anchor="start">付款。</text>
<rect x="20" y="1076.2" width="800" height="54.599999999999994" rx="5" fill="#f2f7fc" stroke="#96b6d6"/>
<text x="36" y="1104.2" font-size="19" class="bold" text-anchor="start">上下文保留，权限交接后继续原来的购物 Work。</text>
<text x="20" y="1162.8" font-size="17" class="muted" text-anchor="start">重构的产品方向示例，并非一次真实观测，也不代表已发布的购物功能。</text>
</svg>
