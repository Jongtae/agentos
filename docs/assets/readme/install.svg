<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Personal AgentOS installation</title>
  <desc id="desc">Homebrew installation and local startup in two commands, followed by opening the local browser interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071725"/><stop offset="1" stop-color="#0b2632"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#63e6be"/><stop offset="1" stop-color="#5bc0eb"/></linearGradient>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <text x="80" y="92" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">Install the current baseline in 2 commands</text>
  <text x="80" y="135" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="22">macOS developer / self-host path · no Docker required for the basic local preview</text>

  <rect x="80" y="195" rx="26" width="690" height="320" fill="#0e2635" stroke="#2c5970"/>
  <text x="120" y="248" fill="#63e6be" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">1 · Install</text>
  <rect x="120" y="286" rx="16" width="610" height="120" fill="#07141d"/>
  <text x="150" y="355" fill="#8bf0cd" font-family="Menlo,Consolas,monospace" font-size="25">$ brew install jongtae/agentos/agentos</text>
  <text x="120" y="447" fill="#d8e8f0" font-family="Arial,Helvetica,sans-serif" font-size="18">Homebrew installs Python automatically for this path.</text>
  <text x="120" y="478" fill="#9fb6c3" font-family="Arial,Helvetica,sans-serif" font-size="17">The released Homebrew build can differ from current main.</text>

  <rect x="830" y="195" rx="26" width="690" height="320" fill="#0e2635" stroke="#2c5970"/>
  <text x="870" y="248" fill="#63e6be" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">2 · Start</text>
  <rect x="870" y="286" rx="16" width="610" height="120" fill="#07141d"/>
  <text x="900" y="355" fill="#8bf0cd" font-family="Menlo,Consolas,monospace" font-size="25">$ agentos start</text>
  <text x="870" y="447" fill="#d8e8f0" font-family="Arial,Helvetica,sans-serif" font-size="18">The browser opens at http://127.0.0.1:8787.</text>
  <text x="870" y="478" fill="#9fb6c3" font-family="Arial,Helvetica,sans-serif" font-size="17">Model runtimes / access are configured separately.</text>

  <path d="M770 355 C792 355 808 355 830 355" stroke="url(#accent)" stroke-width="7" fill="none"/>
  <polygon points="830,355 806,342 806,368" fill="#63e6be"/>

  <rect x="80" y="570" rx="22" width="1440" height="160" fill="#0b1f2c" stroke="#26495d"/>
  <text x="115" y="617" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">First supported file-workspace test</text>
  <text x="115" y="655" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="18">Grant a dedicated reference folder and managed workspace, connect a supported direct provider, approve external document sharing if needed,</text>
  <text x="115" y="686" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="18">then ask AgentOS to summarize a source note into a new Markdown result. Restart and find the saved result again.</text>
  <text x="115" y="714" fill="#7f9aaa" font-family="Arial,Helvetica,sans-serif" font-size="15">Exact supported paths and limitations: QUICKSTART.md</text>
</svg>