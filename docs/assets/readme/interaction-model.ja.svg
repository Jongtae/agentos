<svg xmlns="http://www.w3.org/2000/svg" width="840" height="748" viewBox="0 0 840 748" role="img" aria-labelledby="title desc">
<title id="title">対話のあり方が変わる</title><desc id="desc">NASDAQ / Amazon は対話の説明例であり、提供済みの連携機能を示しません。</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="840" height="748" fill="#fff"/>
<text x="20" y="32.0" font-size="24" class="bold" text-anchor="start">対話のあり方が変わる</text>
<text x="20" y="66" font-size="16" class="muted" text-anchor="start">概念を説明する図</text>
<rect x="20" y="86" width="256" height="550" rx="8" fill="#f6f8fa" stroke="#ccd4de"/>
<text x="36" y="118" font-size="16" class="blue bold" text-anchor="start">01</text>
<text x="68" y="118" font-size="20" class="bold" text-anchor="start">Assistant</text>
<text x="36" y="149.0" font-size="19" class="blue bold" text-anchor="start">質問に答える</text>
<rect x="34" y="188" width="228" height="150" rx="5" fill="#ffffff" stroke="#dbe2ea"/>
<text x="46" y="214.0" font-size="18" class="" text-anchor="start">「NVIDIA の今の株価</text>
<text x="46" y="239.2" font-size="18" class="" text-anchor="start">は？」</text>
<circle cx="44" cy="366" r="3" fill="#245b92"/>
<text x="58" y="372" font-size="18" class="" text-anchor="start">質問</text>
<circle cx="44" cy="400" r="3" fill="#245b92"/>
<path d="M44 372 L44 393" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M40 388 L44 393 L48 388" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="58" y="406" font-size="18" class="" text-anchor="start">検索</text>
<circle cx="44" cy="434" r="3" fill="#245b92"/>
<path d="M44 406 L44 427" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M40 422 L44 427 L48 422" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="58" y="440" font-size="18" class="" text-anchor="start">回答</text>
<text x="36" y="606.0" font-size="16" class="bold" text-anchor="start">現在の会話と回答</text>
<rect x="292" y="86" width="256" height="550" rx="8" fill="#f6f8fa" stroke="#ccd4de"/>
<text x="308" y="118" font-size="16" class="blue bold" text-anchor="start">02</text>
<text x="340" y="118" font-size="20" class="bold" text-anchor="start">Computer agent</text>
<text x="308" y="149.0" font-size="19" class="blue bold" text-anchor="start">命令を実行する</text>
<rect x="306" y="188" width="228" height="150" rx="5" fill="#ffffff" stroke="#dbe2ea"/>
<text x="318" y="214.0" font-size="18" class="" text-anchor="start">「このヘッドホンを</text>
<text x="318" y="239.2" font-size="18" class="" text-anchor="start">Amazon のカートに入れ</text>
<text x="318" y="264.4" font-size="18" class="" text-anchor="start">て。」</text>
<circle cx="316" cy="366" r="3" fill="#245b92"/>
<text x="330" y="372" font-size="18" class="" text-anchor="start">明示的な命令</text>
<circle cx="316" cy="400" r="3" fill="#245b92"/>
<path d="M316 372 L316 393" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M312 388 L316 393 L320 388" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="330" y="406" font-size="18" class="" text-anchor="start">ブラウザー / ツール</text>
<circle cx="316" cy="434" r="3" fill="#245b92"/>
<path d="M316 406 L316 427" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M312 422 L316 427 L320 422" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="330" y="440" font-size="18" class="" text-anchor="start">行動</text>
<circle cx="316" cy="468" r="3" fill="#245b92"/>
<path d="M316 440 L316 461" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M312 456 L316 461 L320 456" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="330" y="474" font-size="18" class="" text-anchor="start">必要な時に権限</text>
<circle cx="316" cy="502" r="3" fill="#245b92"/>
<path d="M316 474 L316 495" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M312 490 L316 495 L320 490" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="330" y="508" font-size="18" class="" text-anchor="start">引き継ぎ</text>
<text x="308" y="606.0" font-size="16" class="bold" text-anchor="start">作業とブラウザー・ツールの状</text>
<text x="308" y="628.4" font-size="16" class="bold" text-anchor="start">態</text>
<rect x="564" y="86" width="256" height="550" rx="8" fill="#f2f7fc" stroke="#96b6d6"/>
<text x="580" y="118" font-size="16" class="blue bold" text-anchor="start">03</text>
<text x="612" y="118" font-size="20" class="bold" text-anchor="start">Personal AgentOS</text>
<text x="580" y="149.0" font-size="19" class="blue bold" text-anchor="start">所有者と共にあり続ける</text>
<rect x="578" y="188" width="228" height="150" rx="5" fill="#ffffff" stroke="#dbe2ea"/>
<text x="590" y="214.0" font-size="18" class="" text-anchor="start">「コーヒーがもう少な</text>
<text x="590" y="239.2" font-size="18" class="" text-anchor="start">い。」→ 後で「前と同じ</text>
<text x="590" y="264.4" font-size="18" class="" text-anchor="start">ものを買っておいて。」</text>
<circle cx="588" cy="366" r="3" fill="#245b92"/>
<text x="602" y="372" font-size="18" class="" text-anchor="start">時間をまたぐ会話</text>
<circle cx="588" cy="400" r="3" fill="#245b92"/>
<path d="M588 372 L588 393" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M584 388 L588 393 L592 388" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="602" y="406" font-size="18" class="" text-anchor="start">文脈</text>
<circle cx="588" cy="434" r="3" fill="#245b92"/>
<path d="M588 406 L588 427" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M584 422 L588 427 L592 422" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="602" y="440" font-size="18" class="" text-anchor="start">判断</text>
<circle cx="588" cy="468" r="3" fill="#245b92"/>
<path d="M588 440 L588 461" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M584 456 L588 461 L592 456" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="602" y="474" font-size="18" class="" text-anchor="start">継続する作業</text>
<circle cx="588" cy="502" r="3" fill="#245b92"/>
<path d="M588 474 L588 495" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M584 490 L588 495 L592 490" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="602" y="508" font-size="18" class="" text-anchor="start">必要な時に権限</text>
<circle cx="588" cy="536" r="3" fill="#245b92"/>
<path d="M588 508 L588 529" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M584 524 L588 529 L592 524" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="602" y="542" font-size="18" class="" text-anchor="start">継続する Presence</text>
<text x="580" y="606.0" font-size="16" class="bold" text-anchor="start">所有者の文脈と作業を維持</text>
<text x="20" y="691.0" font-size="16" class="muted" text-anchor="start">NASDAQ / Amazon は対話の説明例であり、提供済みの連携機能を示しません。</text>
</svg>
