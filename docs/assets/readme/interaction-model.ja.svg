<svg xmlns="http://www.w3.org/2000/svg" width="560" height="824" viewBox="0 0 560 824" role="img" aria-labelledby="title desc">
<title id="title">対話モデル</title>
<desc id="desc">説明用の比較: 質問に答えるアシスタント、命令を実行するコンピューターエージェント、持続する所有者の文脈を扱う Personal AgentOS。提供済みの連携機能ではありません。</desc>
<style>
text{font-family:Arial,"Noto Sans",sans-serif;fill:#1f2328;font-size:26px}
.heading{font-size:30px;font-weight:700}.label{font-size:28px;font-weight:700}.muted{fill:#3d444d}.center{text-anchor:middle}
</style>
<rect width="560" height="824" fill="#ffffff"/>
<text x="24" y="40" class="heading">対話モデル</text>
<rect x="20" y="64" width="520" height="210" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="44" y="102" class="heading">1 · Assistant</text>
<text x="44" y="138" class="label">質問に答える</text>
<text x="44" y="176" class="">「NVIDIA は今いくら？」</text>
<text x="44" y="256" class="muted">現在の会話と回答</text>
<rect x="20" y="290" width="520" height="210" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="44" y="328" class="heading">2 · Computer agent</text>
<text x="44" y="364" class="label">命令を実行する</text>
<text x="44" y="402">「このヘッドホンを</text>
<text x="44" y="436">Amazon のカートに入れて」</text>
<text x="44" y="482" class="muted">タスクとブラウザー・ツールの状態</text>
<rect x="20" y="516" width="520" height="210" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="44" y="554" class="heading">3 · Personal AgentOS</text>
<text x="44" y="590" class="label">所有者とともに続く</text>
<text x="44" y="628" class="">「コーヒーがもう少ない。」</text>
<text x="44" y="662" class="">後で:「前と同じものを買っておいて。」</text>
<text x="44" y="708" class="muted">AI が変わっても文脈と作業は続く</text>
<text x="24" y="774" class="muted">NASDAQ / Amazon は対話モデルの例です。</text>
<text x="24" y="808" class="muted">提供済みの連携機能を意味しません。</text>
</svg>
