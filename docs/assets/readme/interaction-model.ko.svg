<text x="308" y="118" font-size="16" class="blue bold" text-anchor="start">02</text>
<text x="340" y="118" font-size="20" class="bold" text-anchor="start">Computer agent</text>
<text x="308" y="149.0" font-size="19" class="blue bold" text-anchor="start">명령을 실행한다</text>
<rect x="306" y="188" width="228" height="150" rx="5" fill="#ffffff" stroke="#dbe2ea"/>
<text x="318" y="214.0" font-size="18" class="" text-anchor="start">“이 헤드폰을 Amazon</text>
<text x="318" y="239.2" font-size="18" class="" text-anchor="start">장바구니에 담아줘.”</text>
<circle cx="316" cy="366" r="3" fill="#245b92"/>
<text x="330" y="372" font-size="18" class="" text-anchor="start">명시적인 명령</text>
