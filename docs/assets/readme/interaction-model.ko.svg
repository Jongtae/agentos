<path d="M588 474 L588 495" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M584 490 L588 495 L592 490" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="602" y="508" font-size="18" class="" text-anchor="start">필요할 때 권한</text>
<circle cx="588" cy="536" r="3" fill="#245b92"/>
<path d="M588 508 L588 529" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M584 524 L588 529 L592 524" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<text x="602" y="542" font-size="18" class="" text-anchor="start">지속되는 Presence</text>
<text x="580" y="606.0" font-size="16" class="bold" text-anchor="start">소유자의 맥락과 작업이 지속</text>
<text x="20" y="691.0" font-size="16" class="muted" text-anchor="start">NASDAQ / Amazon은 상호작용 예시이며, 배포된 통합 기능 주장이 아닙니다.</text>
