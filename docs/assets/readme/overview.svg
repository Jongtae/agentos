<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal AgentOS overview</title>
  <desc id="desc">Illustrative owner journey from a natural-language request through approved context and runtime boundaries to a saved file and evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071725"/><stop offset="1" stop-color="#0b2430"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#63e6be"/><stop offset="1" stop-color="#5bc0eb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="92" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700">Personal AgentOS</text>
  <text x="80" y="138" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="24">Ask for an outcome. Use only approved context and capabilities. Keep the result and evidence.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" rx="28" width="450" height="570" fill="#0d2433" stroke="#28506a"/>
    <rect x="575" y="190" rx="28" width="450" height="570" fill="#0d2433" stroke="#28506a"/>
    <rect x="1080" y="190" rx="28" width="450" height="570" fill="#0d2433" stroke="#28506a"/>
  </g>

  <text x="105" y="245" fill="#63e6be" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">1 · Ask</text>
  <text x="105" y="287" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">A conversation that can do work</text>
  <rect x="105" y="330" rx="18" width="380" height="94" fill="#17364a"/>
  <text x="125" y="365" fill="#dceaf2" font-family="Arial,Helvetica,sans-serif" font-size="19">
    <tspan x="125" dy="0">“Summarize ‘Launch review’ and save it</tspan>
    <tspan x="125" dy="28">as ‘Launch notes’.”</tspan>
  </text>
  <rect x="105" y="447" rx="18" width="380" height="132" fill="#102e3c"/>
  <text x="125" y="482" fill="#dceaf2" font-family="Arial,Helvetica,sans-serif" font-size="18">
    <tspan x="125" dy="0">Read only the approved reference folder.</tspan>
    <tspan x="125" dy="28">Create a new Markdown result in the</tspan>
    <tspan x="125" dy="28">managed workspace. Preserve originals.</tspan>
  </text>
  <rect x="105" y="604" rx="14" width="380" height="96" fill="#12382f" stroke="#4dd7a8"/>
  <text x="125" y="636" fill="#7ff0c6" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">External provider?</text>
  <text x="125" y="664" fill="#c8ded7" font-family="Arial,Helvetica,sans-serif" font-size="16">Approve the intended document sharing first.</text>

  <text x="610" y="245" fill="#63e6be" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">2 · Control</text>
  <text x="610" y="287" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Owner-authoritative boundaries</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="615" y="335" rx="18" width="370" height="78" fill="#142f3f"/><text x="640" y="368" fill="#f5fbff" font-size="20" font-weight="700">Approved context</text><text x="640" y="394" fill="#b8cad6" font-size="16">Reference folders, task snapshot, accepted Memory</text>
    <rect x="615" y="432" rx="18" width="370" height="78" fill="#142f3f"/><text x="640" y="465" fill="#f5fbff" font-size="20" font-weight="700">Selected runtime</text><text x="640" y="491" fill="#b8cad6" font-size="16">Local or external model path chosen by the owner</text>
    <rect x="615" y="529" rx="18" width="370" height="94" fill="#12382f" stroke="#4dd7a8"/><text x="640" y="563" fill="#7ff0c6" font-size="20" font-weight="700">Grant / approval boundary</text><text x="640" y="590" fill="#c8ded7" font-size="16">New authority and consequential effects need</text><text x="640" y="613" fill="#c8ded7" font-size="16">covering permission.</text>
    <rect x="615" y="642" rx="18" width="370" height="70" fill="#142f3f"/><text x="640" y="675" fill="#f5fbff" font-size="20" font-weight="700">Observed Work events</text><text x="640" y="700" fill="#b8cad6" font-size="16">Progress comes from actual tool/runtime activity.</text>
  </g>

  <text x="1115" y="245" fill="#63e6be" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">3 · Keep</text>
  <text x="1115" y="287" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">Ordinary files + evidence</text>
  <rect x="1115" y="335" rx="20" width="380" height="235" fill="#f7fbfd"/>
  <text x="1142" y="377" fill="#153247" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Launch notes.md</text>
  <text x="1142" y="416" fill="#3f5d6e" font-family="Arial,Helvetica,sans-serif" font-size="17">• key findings from approved source files</text>
  <text x="1142" y="449" fill="#3f5d6e" font-family="Arial,Helvetica,sans-serif" font-size="17">• decisions / open questions</text>
  <text x="1142" y="482" fill="#3f5d6e" font-family="Arial,Helvetica,sans-serif" font-size="17">• next actions</text>
  <rect x="1142" y="511" rx="10" width="326" height="38" fill="#e5f6ef"/>
  <text x="1156" y="536" fill="#247a5c" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Original reference files remain unchanged</text>
  <text x="1115" y="618" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Evidence / history</text>
  <text x="1115" y="653" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="17">• sources and revisions where available</text>
  <text x="1115" y="681" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="17">• relevant grants / approval decisions</text>
  <text x="1115" y="709" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="17">• attempted / observed result state</text>

  <path d="M520 475 C545 475 550 475 575 475" stroke="url(#accent)" stroke-width="7" fill="none"/>
  <polygon points="575,475 554,463 554,487" fill="#63e6be"/>
  <path d="M1025 475 C1050 475 1055 475 1080 475" stroke="url(#accent)" stroke-width="7" fill="none"/>
  <polygon points="1080,475 1059,463 1059,487" fill="#63e6be"/>

  <rect x="70" y="798" rx="18" width="1460" height="58" fill="#0a1d29" stroke="#26485b"/>
  <text x="800" y="835" text-anchor="middle" fill="#a9becb" font-family="Arial,Helvetica,sans-serif" font-size="17">
    Illustrative walkthrough based on the documented file-workspace flow — not a live acceptance screenshot.
  </text>
</svg>