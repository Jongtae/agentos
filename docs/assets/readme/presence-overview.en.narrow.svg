<text x="20" y="100.9" font-size="23" class="blue" text-anchor="start">One PA. Your work and</text>
<text x="20" y="131.95000000000002" font-size="23" class="blue" text-anchor="start">context stay yours.</text>
<text x="20" y="174.0" font-size="20" class="muted" text-anchor="start">Interaction model · product</text>
