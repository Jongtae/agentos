<svg xmlns="http://www.w3.org/2000/svg" width="420" height="770" viewBox="0 0 420 770" role="img" aria-labelledby="title desc"><title id="title">Personal AgentOS: professional roles and unified Presence</title><desc id="desc">Owner relationship informs multiple professional lenses, a Decision Model, and a unified Presence. Owner corrections and execution observations feed back into decisions. Conceptual direction, not a shipped implementation.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#8693a1" fill="none"/></marker></defs><rect width="420" height="770" fill="#ffffff"/><text x="210" y="50" text-anchor="middle" font-family="Arial, Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#58718d">PERSONAL AGENTOS</text><rect x="18" y="80" width="384" height="112" rx="18" fill="#f0f2f5" stroke="#d8dee5" stroke-width="2"/><text x="210" y="126" text-anchor="middle" font-family="Arial, Noto Sans, sans-serif" font-size="21" font-weight="700" fill="#17212e">Owner Relationship</text><text x="210" y="158" text-anchor="middle" font-family="Arial, Noto Sans, sans-serif" font-size="11" font-weight="400" fill="#526174">Goals · Memory · Preferences · Commitments · Authority</text><path d="M210 195 V231" stroke="#8693a1" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="18" y="242" width="122.66666666666667" height="100" rx="18" fill="#ffffff" stroke="#d8dee5" stroke-width="2"/><text x="79.33333333333334" y="284" text-anchor="middle" font-family="Arial, Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#17212e">Assistant</text><text x="79.33333333333334" y="314" text-anchor="middle" font-family="Arial, Noto Sans, sans-serif" font-size="9" font-weight="400" fill="#526174">Work coordination</text><rect x="148.66666666666669" y="242" width="122.66666666666667" height="100" rx="18" fill="#ffffff" stroke="#d8dee5" stroke-width="2"/><text x="210.00000000000003" y="284" text-