<svg xmlns="http://www.w3.org/2000/svg" width="840" height="434" viewBox="0 0 840 434" role="img" aria-labelledby="title desc">
<title id="title">One assistant. Your context stays with you.</title><desc id="desc">You talk to one PA. AgentOS connects context, work, permissions and evidence. AI and tools can change beneath that continuing relationship.</desc>
