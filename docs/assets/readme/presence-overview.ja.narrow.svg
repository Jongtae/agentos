<text x="112" y="2339.2499999999995" font-size="20" class="muted" text-anchor="start">事前資料 → メモ → 次の</text>
<text x="112" y="2366.2499999999995" font-size="20" class="muted" text-anchor="start">段階</text>
<path d="M210.0 2386.2499999999995 L210.0 2397.2499999999995" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M206.0 2392.2499999999995 L210.0 2397.2499999999995 L214.0 2392.2499999999995" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="2399.2499999999995" width="340" height="113.7" rx="10" fill="#fff" stroke="#d8e1e7"/>
<g transform="translate(55 2420.2499999999995) scale(0.59375)" fill="none" stroke="#496d92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8h27l9 9v40H14zM41 8v12h9M22 29h19m-19 8h13m-13 8 6 6 13-13"/></g>
