<circle cx="210.0" cy="1222.75" r="39" fill="#e0eee6" stroke="none"/>
<g transform="translate(180.0 1190.75) scale(0.9375)" fill="none" stroke="#257a69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="10" width="40" height="46" rx="5"/><path d="m20 24 3 3 5-7m5 5h11M20 38h7m6 0h11M20 47h7m6 0h11"/></g>
<text x="40" y="1301.75" font-size="25" class="bold" text-anchor="start">Personal AgentOS</text>
<text x="40" y="1336.75" font-size="22" class="blue bold" text-anchor="start">任せた仕事を引き継ぐ</text>
<g transform="translate(38 1367.75) scale(0.375)" fill="none" stroke="#53657a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M13 57v-9a19 19 0 0 1 38 0v9"/></g>
<rect x="74" y="1354.75" width="308" height="85.4" rx="12" fill="#edf4fb" stroke="#edf4fb"/>
<text x="88" y="1389.75" font-size="22" class="" text-anchor="start">来週の会議、気にかけてお</text>
<text x="88" y="1419.45" font-size="22" class="" text-anchor="start">いて。</text>
<g transform="translate(38 1465.15) scale(0.375)" fill="none" stroke="#257a69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="9"/><path d="M32 0v8m0 48v8M0 32h8m48 0h8"/></g>
<rect x="74" y="1452.15" width="308" height="85.4" rx="12" fill="#ffffff" stroke="#d3dedf"/>
<text x="88" y="1487.15" font-size="22" class="" text-anchor="start">未決のことと次の準備を引</text>
<text x="88" y="1516.8500000000001" font-size="22" class="" text-anchor="start">き継ぎます。</text>
<text x="40" y="1579.5500000000002" font-size="20" class="blue bold" text-anchor="start">意図 → 残る仕事 → 次の準備</text>
<circle cx="40" cy="1679.55" r="20" fill="#e9f0f6" stroke="none"/>
<text x="40" y="1686.55" font-size="18" class="blue bold" text-anchor="middle">02</text>
<text x="74" y="1686.55" font-size="28" class="bold" text-anchor="start">一人の PA、仕事と権限</text>
<text x="74" y="1724.35" font-size="28" class="bold" text-anchor="start">は自分の環境に</text>
<g transform="translate(87 1756.1499999999999) scale(0.71875)" fill="none" stroke="#53657a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M13 57v-9a19 19 0 0 1 38 0v9"/></g>
<g transform="translate(277 1756.1499999999999) scale(0.71875)" fill="none" stroke="#257a69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="9"/><path d="M32 0v8m0 48v8M0 32h8m48 0h8"/></g>
<path d="M148 1780.1499999999999H262" fill="none" stroke="#8296a9" stroke-width="1.6"/>
<path d="M155 1774.1499999999999L148 1780.1499999999999L155 1786.1499999999999M255 1774.1499999999999L262 1780.1499999999999L255 1786.1499999999999" fill="none" stroke="#8296a9" stroke-width="1.6"/>
<text x="110" y="1832.1499999999999" font-size="22" class="bold" text-anchor="middle">あなた</text>
<text x="300" y="1830.1499999999999" font-size="20" class="bold" text-anchor="middle">PA · 会話するエ</text>
<text x="300" y="1857.1499999999999" font-size="20" class="bold" text-anchor="middle">ージェント</text>
<path d="M300 1876.1499999999999V1896.1499999999999H210.0V1908.1499999999999" fill="none" stroke="#8296a9" stroke-width="1.6"/>
<rect x="20" y="1908.1499999999999" width="380" height="677.15" rx="18" fill="#f0f6f9" stroke="#b6cad9"/>
<text x="40" y="1954.1499999999999" font-size="26" class="bold" text-anchor="start">Personal AgentOS</text>
<text x="40" y="1987.1499999999999" font-size="20" class="muted" text-anchor="start">自分の環境が PA の状態を保つ。</text>
<rect x="40" y="2016.1499999999999" width="340" height="113.7" rx="10" fill="#fff" stroke="#d8e1e7"/>
<g transform="translate(55 2037.1499999999999) scale(0.59375)" fill="none" stroke="#427665" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="8"/><circle cx="12" cy="12" r="5"/><circle cx="52" cy="15" r="5"/><circle cx="13" cy="52" r="5"/><circle cx="51" cy="51" r="5"/><path d="m16 16 10 10m12 0 10-8M17 48l9-10m12 0 9 9"/></g>
<text x="112" y="2048.1499999999996" font-size="22" class="bold" text-anchor="start">出典のある一つの会議</text>
<text x="112" y="2083.85" font-size="20" class="muted" text-anchor="start">予定の招待 + 提案書 +</text>
<text x="112" y="2110.85" font-size="20" class="muted" text-anchor="start">以前の決定</text>
<path d="M210.0 2130.85 L210.0 2141.85" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M206.0 2136.85 L210.0 2141.85 L214.0 2136.85" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="2143.85" width="340" height="113.7" rx="10" fill="#fff" stroke="#d8e1e7"/>
<g transform="translate(55 2164.85) scale(0.59375)" fill="none" stroke="#427665" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="10" width="40" height="46" rx="5"/><path d="m20 24 3 3 5-7m5 5h11M20 38h7m6 0h11M20 47h7m6 0h11"/></g>
<text x="112" y="2175.85" font-size="22" class="bold" text-anchor="start">異なる関係</text>
<text x="112" y="2211.5499999999997" font-size="20" class="muted" text-anchor="start">予定: 時間; プロジェク</text>
<text x="112" y="2238.5499999999997" font-size="20" class="muted" text-anchor="start">ト: 決定; 招待 ≠ 受諾</text>
<path d="M210.0 2258.5499999999997 L210.0 2269.5499999999997" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<path d="M206.0 2264.5499999999997 L210.0 2269.5499999999997 L214.0 2264.5499999999997" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="40" y="2271.5499999999997" width="340" height="113.7" rx="10" fill="#fff" stroke="#d8e1e7"/>
<g transform="translate(55 2292.5499999999997) scale(0.59375)" fill="none" stroke="#496d92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 6 52 14v16c0 13-9 21-20 28-11-7-20-15-20-28V14z"/><circle cx="32" cy="28" r="6"/><path d="M32 34v10"/></g>
