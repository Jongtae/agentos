<text x="88" y="3212.75" font-size="22" class="" text-anchor="start">今から出るんだけど、途中</text>
<text x="88" y="3242.45" font-size="22" class="" text-anchor="start">で買えるところあるかな？</text>
<g transform="translate(38 3288.15) scale(0.375)" fill="none" stroke="#257a69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="9"/><path d="M32 0v8m0 48v8M0 32h8m48 0h8"/></g>
