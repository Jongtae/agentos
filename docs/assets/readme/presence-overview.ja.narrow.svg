<text x="210.0" y="376.75" font-size="17" class="muted" text-anchor="middle">業務調整</text>
<rect x="20" y="414.70000000000005" width="380" height="100.65" rx="16" fill="#ffffff" stroke="#d8dee5"/>
<text x="210.0" y="456.70000000000005" font-size="22" class="bold" text-anchor="middle">Finance</text>
<text x="210.0" y="489.40000000000003" font-size="17" class="muted" text-anchor="middle">資産管理</text>
<rect x="20" y="527.35" width="380" height="100.65" rx="16" fill="#ffffff" stroke="#d8dee5"/>
<text x="210.0" y="569.35" font-size="22" class="bold" text-anchor="middle">Research</text>
<text x="210.0" y="602.0500000000001" font-size="17" class="muted" text-anchor="middle">情報分析</text>
<text x="210.0" y="661.0" font-size="19" class="muted" text-anchor="middle">ドメイン + 役割 + 委任範囲 + 権限</text>
