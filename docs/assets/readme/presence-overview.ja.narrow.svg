<path d="M206.0 2607.2999999999997 L210.0 2612.2999999999997 L214.0 2607.2999999999997" fill="none" stroke="#8492a3" stroke-width="1.6"/>
<rect x="20" y="2619.2999999999997" width="380" height="106" rx="12" fill="#fafbfd" stroke="#d4dce5"/>
