<text x="210.0" y="207.3" font-size="28" class="bold" text-anchor="middle">あなたとの関係</text>
<text x="210.0" y="242.10000000000002" font-size="17" class="muted" text-anchor="middle">目的 · 記憶 · 好み · 約束 · 権限</text>
