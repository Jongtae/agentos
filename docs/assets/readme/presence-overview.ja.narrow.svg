<text x="88" y="3310.15" font-size="22" class="" text-anchor="start">コーヒーですね。通る道を</text>
<text x="88" y="3339.85" font-size="22" class="" text-anchor="start">教えてもらえれば探しま</text>
<text x="88" y="3369.55" font-size="22" class="" text-anchor="start">す。</text>
