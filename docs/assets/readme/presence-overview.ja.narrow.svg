<text x="20" y="2948.7499999999995" font-size="20" class="muted" text-anchor="start">対話の形と製品の方向性を説明する例で</text>
<text x="20" y="2975.7499999999995" font-size="20" class="muted" text-anchor="start">す。実際に観測した動作や提供済みの連携</text>
<text x="20" y="3002.7499999999995" font-size="20" class="muted" text-anchor="start">機能ではありません。</text>
