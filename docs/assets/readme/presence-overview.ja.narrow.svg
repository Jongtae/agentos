<g transform="translate(44 2747.2999999999997) scale(0.46875)" fill="none" stroke="#526b91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m12 8 11 11-6 6L6 14c-4 14 6 23 18 17l25 25 7-7-25-25C37 12 28 2 16 6l10 10-7 7"/></g>
<text x="88" y="2769.2999999999997" font-size="20" class="" text-anchor="start">ツール</text>
<g transform="translate(228 2747.2999999999997) scale(0.46875)" fill="none" stroke="#526b91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 45a12 12 0 0 1-3-24 17 17 0 0 1 32-3 13 13 0 0 1 3 27H16zM22 52v8m20-8v8"/></g>
<text x="270" y="2769.2999999999997" font-size="20" class="" text-anchor="start">サービス</text>
<text x="210.0" y="2830.2999999999997" font-size="25" class="blue bold" text-anchor="middle">同じ PA。 変わる AI。</text>
<text x="210.0" y="2869.0499999999997" font-size="22" class="muted" text-anchor="middle">残る仕事と根拠は自分の環境に。</text>
