<text x="20" y="64.19999999999999" font-size="23" class="bold" text-anchor="start">に。</text>
<rect x="20" y="100" width="380" height="54" rx="8" fill="#fff" stroke="#ccd4de"/>
<text x="155.0" y="135" font-size="21" class="bold" text-anchor="end">あなた</text>
<text x="200.0" y="135" font-size="25" class="blue" text-anchor="middle">⇄</text>
<text x="235.0" y="135" font-size="21" class="bold" text-anchor="start">あなたの PA</text>
<path d="M210.0 158 L210.0 176" fill="none" stroke="#8492a3" stroke-width="1.6"/>
