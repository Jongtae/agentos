<svg xmlns="http://www.w3.org/2000/svg" width="420" height="3033" viewBox="0 0 420 3033" role="img" aria-labelledby="title desc">
<title id="title">Personal AgentOS</title><desc id="desc">対話の形と製品の方向性を説明する例です。実際に観測した動作や提供済みの連携機能ではありません。</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="420" height="3033" fill="#fff"/>
<text x="20" y="58.0" font-size="34" class="bold" text-anchor="start">Personal AgentOS</text>
<text x="20" y="100.9" font-size="23" class="blue" text-anchor="start">同じ PA。文脈は手元に。</text>
<text x="20" y="142.95" font-size="20" class="muted" text-anchor="start">対話の形 · 製品の方向性</text>
