<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="817" viewBox="0 0 1120 817" role="img" aria-labelledby="title desc">
<title id="title">Personal AgentOS</title><desc id="desc">あなたとの関係が Assistant・Finance・Research の専門的視点につながり、ドメイン・役割・委任範囲・権限が Decision Model に入り、Unified Presence が一つの関係を保ちながらあなたの介入を判断に戻します。</desc>
