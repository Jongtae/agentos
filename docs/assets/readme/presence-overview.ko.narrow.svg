<svg xmlns="http://www.w3.org/2000/svg" width="420" height="3077" viewBox="0 0 420 3077" role="img" aria-labelledby="title desc">
<title id="title">Personal AgentOS</title><desc id="desc">상호작용과 제품 방향을 설명하는 예시입니다. 실제 관측 실행이나 배포된 연동 기능을 뜻하지 않습니다.</desc>
<style>text{font-family:Arial,"Noto Sans",sans-serif;fill:#243247} .bold{font-weight:700} .muted{fill:#526174} .blue{fill:#245b92}</style>
<rect width="420" height="3077" fill="#fff"/>
<text x="20" y="58.0" font-size="34" class="bold" text-anchor="start">Personal AgentOS</text>
<text x="20" y="100.9" font-size="23" class="blue" text-anchor="start">하나의 PA. 내 일과 맥락은 내</text>
<text x="20" y="131.95000000000002" font-size="23" class="blue" text-anchor="start">환경에.</text>
<text x="20" y="174.0" font-size="20" class="muted" text-anchor="start">상호작용 모델 · 제품 방향</text>
<circle cx="40" cy="234.0" r="20" fill="#e9f0f6" stroke="none"/>
<text x="40" y="241.0" font-size="18" class="blue bold" text-anchor="middle">01</text>
<text x="74" y="241.0" font-size="28" class="bold" text-anchor="start">답변과 명령을 넘어,</text>
<text x="74" y="278.8" font-size="28" class="bold" text-anchor="start">이어지는 일로</text>
<rect x="20" y="310.6" width="380" height="410.09999999999997" rx="16" fill="#f7f9fc" stroke="#d4dce5"/>
