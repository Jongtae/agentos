<text x="88" y="1090.8000000000002" font-size="22" class="" text-anchor="start">열어볼게요.</text>
<text x="40" y="1153.5000000000002" font-size="20" class="blue bold" text-anchor="start">명령 → 브라우저·도구 → 실행·권한</text>
