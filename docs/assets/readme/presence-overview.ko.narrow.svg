<text x="40" y="445.6" font-size="25" class="bold" text-anchor="start">Assistant</text>
<text x="40" y="480.6" font-size="22" class="blue bold" text-anchor="start">답합니다</text>
<g transform="translate(38 511.6) scale(0.375)" fill="none" stroke="#53657a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M13 57v-9a19 19 0 0 1 38 0v9"/></g>
<rect x="74" y="498.6" width="308" height="85.4" rx="12" fill="#edf4fb" stroke="#edf4fb"/>
<text x="88" y="533.6" font-size="22" class="" text-anchor="start">지금 NVIDIA 주가는</text>
<text x="88" y="563.3000000000001" font-size="22" class="" text-anchor="start">얼마야?</text>
<g transform="translate(38 609.0) scale(0.375)" fill="none" stroke="#257a69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="9"/><path d="M32 0v8m0 48v8M0 32h8m48 0h8"/></g>
<rect x="74" y="596.0" width="308" height="55.7" rx="12" fill="#ffffff" stroke="#d3dedf"/>
<text x="88" y="631.0" font-size="22" class="" text-anchor="start">최신 정보를 확인할게요.</text>
<text x="40" y="693.7" font-size="20" class="blue bold" text-anchor="start">질문 → 검색 → 답변</text>
