<text x="40" y="875.7" font-size="25" class="bold" text-anchor="start">Computer agent</text>
<text x="40" y="910.7" font-size="22" class="blue bold" text-anchor="start">실행합니다</text>
<g transform="translate(38 941.7) scale(0.375)" fill="none" stroke="#53657a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M13 57v-9a19 19 0 0 1 38 0v9"/></g>
<rect x="74" y="928.7" width="308" height="85.4" rx="12" fill="#edf4fb" stroke="#edf4fb"/>
