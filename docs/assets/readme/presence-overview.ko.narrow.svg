<text x="74" y="1717.6" font-size="28" class="bold" text-anchor="start">하나의 PA, 내 환경에</text>
<text x="74" y="1755.3999999999999" font-size="28" class="bold" text-anchor="start">남는 일과 권한</text>
<g transform="translate(87 1787.1999999999998) scale(0.71875)" fill="none" stroke="#53657a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="17" r="10"/><path d="M13 57v-9a19 19 0 0 1 38 0v9"/></g>
