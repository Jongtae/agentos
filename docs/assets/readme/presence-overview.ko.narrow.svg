<text x="88" y="993.4000000000001" font-size="22" class="" text-anchor="start">장바구니에 넣어줘.</text>
<g transform="translate(38 1039.1000000000001) scale(0.375)" fill="none" stroke="#257a69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="9"/><path d="M32 0v8m0 48v8M0 32h8m48 0h8"/></g>
<rect x="74" y="1026.1000000000001" width="308" height="85.4" rx="12" fill="#ffffff" stroke="#d3dedf"/>
