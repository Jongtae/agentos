<g transform="translate(38 1496.2) scale(0.375)" fill="none" stroke="#257a69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="9"/><path d="M32 0v8m0 48v8M0 32h8m48 0h8"/></g>
<rect x="74" y="1483.2" width="308" height="85.4" rx="12" fill="#ffffff" stroke="#d3dedf"/>
<text x="88" y="1518.2" font-size="22" class="" text-anchor="start">남은 결정과 다음 준비를</text>
<text x="88" y="1547.9" font-size="22" class="" text-anchor="start">이어갈게요.</text>
<text x="40" y="1610.6000000000001" font-size="20" class="blue bold" text-anchor="start">의도 → 남은 일 → 다음 준비</text>
<circle cx="40" cy="1710.6" r="20" fill="#e9f0f6" stroke="none"/>
