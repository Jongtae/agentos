<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="817" viewBox="0 0 1120 817" role="img" aria-labelledby="title desc">
<title id="title">Personal AgentOS</title><desc id="desc">与你的关系连接 Assistant、Finance、Research 三种专业视角；领域、角色、委托范围与权限进入 Decision Model；Unified Presence 维持同一段关系，并把你的介入反馈给判断。</desc>
