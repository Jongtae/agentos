<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
<title id="title">Presence architecture</title>
<desc id="desc">The owner talks to one PA; AgentOS owns Memory, Context, Work, Authority, Evidence and Events. Judgment orchestrates replaceable AI and tools.</desc>
<style>
text{font-family:Arial,"Noto Sans",sans-serif;fill:#1f2328;font-size:26px}
.heading{font-size:30px;font-weight:700}.label{font-size:28px;font-weight:700}.muted{fill:#3d444d}.center{text-anchor:middle}
</style>
<rect width="640" height="660" fill="#ffffff"/>
<text x="320" y="42" class="heading center">Owner ⇄ PA</text>
<text x="320" y="80" class="center">One continuous conversation</text>
<g stroke="#57606a" stroke-width="2" fill="none">
<path d="M320 96V122m-7-7 7 7 7-7"/>
<path d="M320 322V360m-7-7 7 7 7-7"/>
<path d="M320 440V478m-7-7 7 7 7-7"/>
</g>
<rect x="20" y="134" width="600" height="188" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="320" y="174" class="heading center">Personal AgentOS</text>
<text x="320" y="216" class="center">Memory · Context · Work</text>
<text x="320" y="258" class="center">Authority · Evidence · Events</text>
<text x="320" y="300" class="muted center">Owner-controlled state</text>
<rect x="20" y="372" width="600" height="68" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="320" y="414" class="label center">Judgment / orchestration</text>
<rect x="20" y="490" width="600" height="100" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="320" y="530" class="label center">Replaceable AI</text>
<text x="320" y="568" class="center">Tools / services / skills</text>
<text x="320" y="640" class="label center">Same PA. Different AI.</text>
</svg>
