<rect x="20" y="490" width="600" height="100" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="320" y="530" class="label center">교체 가능한 AI</text>
<text x="320" y="568" class="center">도구 / 서비스 / 스킬</text>
