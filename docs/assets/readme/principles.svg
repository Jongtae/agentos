<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal AgentOS product principles</title>
  <desc id="desc">Five product principles: useful work, owner-authoritative state, explicit boundaries, durable results and evidence, and replaceable workers without losing owner state.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071725"/><stop offset="1" stop-color="#0c2732"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="88" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">Principles &amp; philosophy</text>
  <text x="80" y="132" fill="#b8cad6" font-family="Arial,Helvetica,sans-serif" font-size="22">Useful work inside owner-controlled, observable boundaries.</text>

  <rect x="485" y="185" rx="28" width="630" height="190" fill="#113041" stroke="#49dcb0" stroke-width="2"/>
  <text x="800" y="242" text-anchor="middle" fill="#63e6be" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Personal AgentOS</text>
  <text x="800" y="287" text-anchor="middle" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Owner-authoritative Personal AI Kernel</text>
  <text x="800" y="323" text-anchor="middle" fill="#f5fbff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">+ Open Agent Distribution Platform</text>
  <text x="800" y="352" text-anchor="middle" fill="#9fb6c3" font-family="Arial,Helvetica,sans-serif" font-size="16">Architecture direction; implementation status is tracked separately.</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="80" y="430" rx="22" width="420" height="160" fill="#0e2635" stroke="#2b566b"/>
    <text x="115" y="475" fill="#63e6be" font-size="21" font-weight="700">Useful from the beginning</text>
    <text x="115" y="511" fill="#d9e8ef" font-size="18">Do complete tasks, not disconnected demos.</text>
    <text x="115" y="542" fill="#9fb6c3" font-size="16">Measure result quality, owner effort and failure modes.</text>

    <rect x="590" y="430" rx="22" width="420" height="160" fill="#0e2635" stroke="#2b566b"/>
    <text x="625" y="475" fill="#63e6be" font-size="21" font-weight="700">Owner-authoritative state</text>
    <text x="625" y="511" fill="#d9e8ef" font-size="18">Memory, Grants, Work and Evidence stay with AgentOS.</text>
    <text x="625" y="542" fill="#9fb6c3" font-size="16">Models and agents are replaceable workers.</text>

    <rect x="1100" y="430" rx="22" width="420" height="160" fill="#0e2635" stroke="#2b566b"/>
    <text x="1135" y="475" fill="#63e6be" font-size="21" font-weight="700">Explicit boundaries</text>
    <text x="1135" y="511" fill="#d9e8ef" font-size="18">Choose data, destinations, actions and approvals.</text>
    <text x="1135" y="542" fill="#9fb6c3" font-size="16">Install and connection do not imply authority.</text>

    <rect x="335" y="630" rx="22" width="420" height="160" fill="#0e2635" stroke="#2b566b"/>
    <text x="370" y="675" fill="#63e6be" font-size="21" font-weight="700">Durable results &amp; evidence</text>
    <text x="370" y="711" fill="#d9e8ef" font-size="18">Keep ordinary artifacts, history and provenance.</text>
    <text x="370" y="742" fill="#9fb6c3" font-size="16">Preserve originals and distinguish observed vs unknown.</text>

    <rect x="845" y="630" rx="22" width="420" height="160" fill="#0e2635" stroke="#2b566b"/>
    <text x="880" y="675" fill="#63e6be" font-size="21" font-weight="700">Replace workers, keep owner state</text>
    <text x="880" y="711" fill="#d9e8ef" font-size="18">The design preserves owner outputs across replacement.</text>
    <text x="880" y="742" fill="#9fb6c3" font-size="16">Replacement receives fresh authority; Grants are not inherited.</text>
  </g>

  <text x="800" y="850" text-anchor="middle" fill="#7f9aaa" font-family="Arial,Helvetica,sans-serif" font-size="16">Current implementation and planned package/marketplace work are explicitly separated in the README status table.</text>
</svg>