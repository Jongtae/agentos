[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agentos"
version = "1.0.4"
description = "A lightweight self-hosted personal agent with browser setup"
requires-python = ">=3.12"
dependencies = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1", "cryptography>=42.0", "mcp-types>=2.2,<3"]

[project.optional-dependencies]
schema-validation = ["jsonschema[format]>=4.23"]

[project.scripts]
agentos = "personal_agent.quickstart:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["personal_agent*"]

[tool.setuptools.package-data]
personal_agent = ["web/*.html", "web/*.css", "web/*.js", "delivery-plan.yaml"]
