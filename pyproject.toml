[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agentos"
version = "1.1.1"
description = "A lightweight self-hosted personal agent with browser setup"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}
# mcp-types: MCP protocol-version registry (REUSE-R2 #426). MIT; the
# envelope models are deliberately not adopted - see the bridge docstrings.
# oauthlib: RFC 6749/7636 authorization-request construction (REUSE-R1b #427).
# BSD-3-Clause, zero mandatory dependencies, imports no HTTP library.
# pyobjc-framework-WebKit: SEC-BROWSER-02 #680 embedded macOS system WebKit
# browser (MIT, Ronald Oussoren; 12.2.2 reviewed). macOS only; it pulls
# pyobjc-core and pyobjc-framework-Cocoa (MIT). No browser download.
# publicsuffixlist: #716 registrable domain (eTLD+1) of a login host from the
# bundled Mozilla Public Suffix List (MPL-2.0, ko-zu; 1.0.2.20260925 reviewed).
# Pure Python, zero mandatory dependencies, never fetches the list at runtime.
# PyYAML: #961 parses Agent Skills SKILL.md frontmatter with SafeLoader only
# (MIT, YAML project; 6.0.3 reviewed; #960 decision record section 4).
dependencies = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1", "cryptography>=42.0", "mcp-types>=2.2,<3", "oauthlib>=3.3.1,<4",
                "pyobjc-framework-WebKit>=12.2,<13; sys_platform == 'darwin'", "publicsuffixlist>=1.0.2,<2", "PyYAML>=6.0.1,<7"]

[project.optional-dependencies]
schema-validation = ["jsonschema[format]>=4.23"]

[project.scripts]
agentos = "personal_agent.quickstart:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["personal_agent*"]

[tool.setuptools.package-data]
personal_agent = ["web/*.html", "web/*.css", "web/*.js", "bundled_skills/*/SKILL.md"]
